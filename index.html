<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Master · Ordini, Magazzino e Marginalità</title>

<script src="https://unpkg.com/react@18.3.1/umd/react.production.min.js" crossorigin></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.production.min.js" crossorigin></script>

<style>
:root{
  --ink:#12202f; --ink-2:#1c3047; --ink-3:#2b4763;
  --paper:#f2f1ec; --card:#ffffff; --line:#d9d7ce; --line-soft:#e8e6df;
  --text:#1b2430; --muted:#6b7683;
  --gold:#b8811b; --gold-soft:#f6ecd6;
  --green:#2f7a55; --green-soft:#e6f2ea;
  --red:#b3372e; --red-soft:#fbeae8;
  --blue:#31607f;
  --r:6px;
  --mono:ui-monospace,SFMono-Regular,"SF Mono",Menlo,Consolas,monospace;
}
*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{
  background:var(--paper); color:var(--text);
  font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
  font-size:14px; line-height:1.45; -webkit-font-smoothing:antialiased;
}
button,input,select,textarea{font:inherit;color:inherit}
a{color:var(--blue)}
.num{font-variant-numeric:tabular-nums;font-family:var(--mono);font-size:13px}

/* ---------- shell ---------- */
.shell{display:flex;min-height:100vh}
.side{
  width:214px;flex:0 0 214px;background:var(--ink);color:#cfd8e2;
  display:flex;flex-direction:column;position:sticky;top:0;height:100vh;
}
.brand{padding:18px 18px 14px;border-bottom:1px solid rgba(255,255,255,.09)}
.brand h1{margin:0;font:600 21px/1 Georgia,"Times New Roman",serif;letter-spacing:.04em;color:#fff}
.brand .sub{display:block;margin-top:5px;font-size:11.5px;color:#8ea1b4}
.nav{padding:10px 8px;flex:1;overflow:auto}
.nav button{
  display:flex;align-items:center;gap:9px;width:100%;text-align:left;
  background:none;border:0;color:#c3cede;padding:8px 10px;border-radius:var(--r);
  cursor:pointer;font-size:13.5px;margin-bottom:2px;
}
.nav button:hover{background:rgba(255,255,255,.07);color:#fff}
.nav button.on{background:var(--gold);color:#1b1405;font-weight:600}
.nav .ico{width:18px;text-align:center;font-size:14px;opacity:.9}
.sidefoot{padding:10px 14px;border-top:1px solid rgba(255,255,255,.09);font-size:11px;color:#8ea1b4}
.dot{display:inline-block;width:7px;height:7px;border-radius:50%;margin-right:6px;vertical-align:middle}
.main{flex:1;min-width:0;display:flex;flex-direction:column}
.topbar{
  background:var(--card);border-bottom:1px solid var(--line);
  padding:13px 22px;display:flex;align-items:center;gap:14px;flex-wrap:wrap;
  position:sticky;top:0;z-index:30;
}
.topbar h2{margin:0;font:600 17px/1.2 Georgia,serif}
.topbar .hint{color:var(--muted);font-size:12.5px}
.spacer{flex:1}
.wrap{padding:20px 22px 60px;max-width:1500px;width:100%}

/* ---------- buttons ---------- */
.btn{
  border:1px solid var(--line);background:var(--card);border-radius:var(--r);
  padding:6px 11px;cursor:pointer;font-size:13px;display:inline-flex;align-items:center;gap:6px;
}
.btn:hover{border-color:#b9b5a8;background:#fbfaf7}
.btn:active{transform:translateY(1px)}
.btn.pri{background:var(--ink);border-color:var(--ink);color:#fff}
.btn.pri:hover{background:var(--ink-2);border-color:var(--ink-2)}
.btn.gold{background:var(--gold);border-color:var(--gold);color:#1b1405;font-weight:600}
.btn.gold:hover{background:#a5730f}
.btn.danger{color:var(--red);border-color:#e2c4c0}
.btn.danger:hover{background:var(--red-soft)}
.btn.sm{padding:3px 8px;font-size:12px}
.btn:disabled{opacity:.45;cursor:not-allowed}
.btnrow{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.icobtn{border:0;background:none;cursor:pointer;padding:3px 5px;border-radius:4px;color:var(--muted);font-size:13px}
.icobtn:hover{background:var(--line-soft);color:var(--text)}
.icobtn.del:hover{background:var(--red-soft);color:var(--red)}

/* ---------- cards / tables ---------- */
.card{background:var(--card);border:1px solid var(--line);border-radius:8px}
.card>header{padding:11px 14px;border-bottom:1px solid var(--line-soft);display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.card>header h3{margin:0;font:600 14px/1.3 inherit}
.card .body{padding:14px}
.grid{display:grid;gap:14px}
table{width:100%;border-collapse:collapse}
th{
  text-align:left;font-size:11.5px;font-weight:600;color:var(--muted);
  padding:7px 9px;border-bottom:1px solid var(--line);white-space:nowrap;background:#faf9f6;
  position:sticky;top:0;z-index:2;
}
td{padding:6px 9px;border-bottom:1px solid var(--line-soft);vertical-align:middle}
tbody tr:hover td{background:#fcfbf8}
.t-right{text-align:right}
.t-center{text-align:center}
.scroll{overflow:auto;max-height:70vh}
tfoot td{background:#f7f6f2;font-weight:600;border-top:1px solid var(--line);border-bottom:0;position:sticky;bottom:0}

/* ---------- fields ---------- */
.f{display:flex;flex-direction:column;gap:4px}
.f label{font-size:11.5px;color:var(--muted);font-weight:600}
input[type=text],input[type=number],input[type=date],select,textarea{
  border:1px solid var(--line);border-radius:var(--r);padding:6px 8px;background:#fff;width:100%;
}
input:focus,select:focus,textarea:focus{outline:2px solid #c9d7e4;outline-offset:-1px;border-color:var(--ink-3)}
textarea{resize:vertical;min-height:62px}
.cellinput{border:1px solid transparent;background:transparent;padding:3px 5px;border-radius:4px;width:100%}
.cellinput:hover{border-color:var(--line)}
.cellinput:focus{background:#fff;border-color:var(--ink-3)}
.cellinput.n{text-align:right;font-variant-numeric:tabular-nums;font-family:var(--mono);font-size:13px}
.formgrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:12px}

/* ---------- misc ---------- */
.tag{display:inline-block;padding:1.5px 7px;border-radius:99px;font-size:11px;border:1px solid var(--line);background:#fafaf7;white-space:nowrap}
.tag.b{background:var(--gold-soft);border-color:#e6d3a8;color:#7a5607}
.tag.g{background:var(--green-soft);border-color:#bfdccb;color:#1f5a3c}
.tag.r{background:var(--red-soft);border-color:#eec9c5;color:#8f2a22}
.tag.n{background:#eef2f6;border-color:#cfdae4;color:#2c4a63}
.pos{color:var(--green);font-weight:600}
.neg{color:var(--red);font-weight:600}
.muted{color:var(--muted)}
.small{font-size:12px}
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(168px,1fr));gap:12px}
.kpi{background:var(--card);border:1px solid var(--line);border-radius:8px;padding:13px 14px}
.kpi .lab{font-size:11.5px;color:var(--muted)}
.kpi .val{font:600 23px/1.25 Georgia,serif;font-variant-numeric:tabular-nums;margin-top:3px}
.kpi .sub{font-size:11.5px;color:var(--muted);margin-top:2px}
.kpi.acc{border-left:3px solid var(--gold)}
.bar{height:6px;background:var(--line-soft);border-radius:99px;overflow:hidden;min-width:54px}
.bar i{display:block;height:100%;background:var(--green)}
.bar i.low{background:var(--gold)}
.bar i.bad{background:var(--red)}
.empty{padding:36px 18px;text-align:center;color:var(--muted)}
.empty p{margin:0 0 12px}
.toolbar{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin-bottom:12px}
.search{position:relative;min-width:190px;flex:1;max-width:340px}
.search input{padding-left:28px}
.search::before{content:"⌕";position:absolute;left:9px;top:5px;color:var(--muted);font-size:15px}

/* order tabs */
.otabs{display:flex;gap:6px;overflow:auto;padding:8px 22px 0;background:var(--card);border-bottom:1px solid var(--line)}
.otab{border:1px solid var(--line);border-bottom:0;background:#f7f6f2;border-radius:7px 7px 0 0;padding:6px 10px;cursor:pointer;font-size:12.5px;white-space:nowrap;display:flex;gap:8px;align-items:center;color:var(--muted)}
.otab.on{background:var(--card);color:var(--text);font-weight:600;box-shadow:0 1px 0 #fff}
.otab .x{opacity:.5}
.otab .x:hover{opacity:1;color:var(--red)}

/* modal */
.ovl{position:fixed;inset:0;background:rgba(18,32,47,.5);display:flex;align-items:flex-start;justify-content:center;padding:40px 16px;z-index:100;overflow:auto}
.modal{background:var(--card);border-radius:10px;max-width:720px;width:100%;box-shadow:0 18px 50px rgba(0,0,0,.28)}
.modal.lg{max-width:980px}
.modal>header{padding:14px 18px;border-bottom:1px solid var(--line-soft);display:flex;align-items:center}
.modal>header h3{margin:0;font:600 16px/1.2 Georgia,serif}
.modal .body{padding:18px}
.modal>footer{padding:12px 18px;border-top:1px solid var(--line-soft);display:flex;gap:8px;justify-content:flex-end}

/* toast */
.toasts{position:fixed;bottom:18px;right:18px;display:flex;flex-direction:column;gap:8px;z-index:200}
.toast{background:var(--ink);color:#fff;padding:9px 14px;border-radius:var(--r);font-size:13px;box-shadow:0 6px 20px rgba(0,0,0,.25);max-width:330px}
.toast.err{background:var(--red)}
.toast.ok{background:var(--green)}

/* mobile */
.mobnav{display:none}
@media(max-width:860px){
  .side{display:none}
  .shell{flex-direction:column}
  .wrap{padding:14px 12px 80px}
  .topbar{padding:11px 12px}
  .otabs{padding:8px 12px 0}
  .mobnav{
    display:flex;position:fixed;bottom:0;left:0;right:0;background:var(--ink);z-index:50;
    overflow:auto;padding:6px 6px calc(6px + env(safe-area-inset-bottom));gap:4px;
  }
  .mobnav button{flex:1 0 auto;background:none;border:0;color:#bcc9d8;font-size:10.5px;padding:6px 8px;border-radius:6px;display:flex;flex-direction:column;align-items:center;gap:3px}
  .mobnav button.on{background:var(--gold);color:#1b1405;font-weight:600}
  .mobnav .ico{font-size:15px}
  .formgrid{grid-template-columns:1fr 1fr}
}
@media print{.side,.topbar,.mobnav,.toolbar,.otabs{display:none}}
</style>
</head>
<body>
<div id="root"></div>
<script type="text/babel" data-presets="react">
const {useState,useEffect,useMemo,useRef,useCallback} = React;

/* ============================================================
   CONFIGURAZIONE FIREBASE  —  incolla qui la config del progetto
   Finché projectId è vuoto l'app lavora in locale (localStorage).
   ============================================================ */
const FIREBASE_CONFIG = {
  apiKey: "AIzaSyA7DTTAK5wNxHk50hRMq_XU-KNZ6SQB4f8",
  authDomain: "master-6842b.firebaseapp.com",
  projectId: "master-6842b",
  storageBucket: "master-6842b.firebasestorage.app",
  messagingSenderId: "945140546142",
  appId: "1:945140546142:web:b43e812f6c1a306eb0d2cf"
};
const DB_ROOT = "master";     // collection Firestore
const LS_PREFIX = "master_v1_";

/* ============================ utils ============================ */
const uid = () => Date.now().toString(36) + Math.random().toString(36).slice(2,8);
const n = v => { const x = typeof v === "number" ? v : parseFloat(String(v ?? "").replace(/\s/g,"").replace(",", ".")); return isFinite(x) ? x : 0; };
const eur = (v,d=2) => n(v).toLocaleString("it-IT",{minimumFractionDigits:d,maximumFractionDigits:d}) + " €";
const num = (v,d=2) => n(v).toLocaleString("it-IT",{minimumFractionDigits:d,maximumFractionDigits:d});
const pct = v => (n(v)*100).toLocaleString("it-IT",{minimumFractionDigits:1,maximumFractionDigits:1}) + "%";
const today = () => new Date().toISOString().slice(0,10);
const dmy = s => s ? String(s).slice(0,10).split("-").reverse().join("/") : "";
const norm = s => String(s ?? "").toLowerCase().normalize("NFD").replace(/[\u0300-\u036f]/g,"").replace(/[^a-z0-9]+/g," ").trim();
const byText = (q, ...fields) => { const k = norm(q); return !k || fields.some(f => norm(f).includes(k)); };
const clone = o => JSON.parse(JSON.stringify(o));
const download = (blob, name) => { const u = URL.createObjectURL(blob); const a = document.createElement("a"); a.href = u; a.download = name; document.body.appendChild(a); a.click(); a.remove(); setTimeout(()=>URL.revokeObjectURL(u),1500); };
const slug = s => norm(s).replace(/ /g,"_").slice(0,48) || "file";

/* IVA: accetta 22, 0.22, "22%" */
const parseIva = v => { let x = n(v); if (x > 1) x = x/100; return x < 0 ? 0 : x; };

/* costo ivato di un articolo (per unità d'acquisto) e per unità base */
const costoUn = a => n(a.prezzo) * (1 + parseIva(a.iva));
const contenuto = a => (n(a.contenuto) > 0 ? n(a.contenuto) : 1);
const costoBase = a => costoUn(a) / contenuto(a);

/* ============================ storage ============================ */
const COLLS = ["articoli","fornitori","ordini","prodotti","ubicazioni","movimenti","config"];

const Store = {
  mode: "local", db: null, unsubs: [], last: {},
  init(){
    try{
      if (FIREBASE_CONFIG.projectId && window.firebase){
        firebase.initializeApp(FIREBASE_CONFIG);
        this.db = firebase.firestore();
        this.mode = "cloud";
      }
    }catch(e){ console.warn("Firebase off:", e); this.mode = "local"; }
    return this.mode;
  },
  readLocal(key, def){
    try{ const r = localStorage.getItem(LS_PREFIX+key); return r ? JSON.parse(r) : def; }catch(e){ return def; }
  },
  writeLocal(key, val){ try{ localStorage.setItem(LS_PREFIX+key, JSON.stringify(val)); }catch(e){} },
  subscribe(key, cb){
    cb(this.readLocal(key, key==="config" ? {} : []));
    if (this.mode !== "cloud") return () => {};
    const ref = this.db.collection(DB_ROOT).doc(key);
    const un = ref.onSnapshot(snap => {
      const d = snap.data();
      if (!d) return;
      const val = key==="config" ? (d.value || {}) : (d.items || []);
      const s = JSON.stringify(val);
      if (s === this.last[key]) return;
      this.last[key] = s;
      this.writeLocal(key, val);
      cb(val);
    }, err => console.warn("snapshot", key, err));
    this.unsubs.push(un);
    return un;
  },
  save(key, val){
    this.writeLocal(key, val);
    if (this.mode !== "cloud") return Promise.resolve();
    this.last[key] = JSON.stringify(val);
    const payload = key==="config" ? {value: val} : {items: val};
    return this.db.collection(DB_ROOT).doc(key).set({...payload, ts: Date.now()})
      .catch(e => { console.warn("save", key, e); throw e; });
  }
};

function useColl(key, def){
  const [data, setData] = useState(() => Store.readLocal(key, def));
  useEffect(() => { const un = Store.subscribe(key, setData); return () => { try{ un && un(); }catch(e){} }; }, [key]);
  const update = useCallback(next => {
    setData(prev => {
      const val = typeof next === "function" ? next(prev) : next;
      Store.save(key, val);
      return val;
    });
  }, [key]);
  return [data, update];
}

/* ============================ toast ============================ */
const ToastCtx = React.createContext(()=>{});
function useToast(){ return React.useContext(ToastCtx); }
function Toasts({items}){
  return <div className="toasts">{items.map(t => <div key={t.id} className={"toast "+(t.kind||"")}>{t.msg}</div>)}</div>;
}

/* ============================ UI atoms ============================ */
function Field({label, children, style}){
  return <div className="f" style={style}><label>{label}</label>{children}</div>;
}
function Txt({value, onChange, ...p}){
  return <input type="text" value={value ?? ""} onChange={e=>onChange(e.target.value)} {...p} />;
}
function Num({value, onChange, step="0.01", ...p}){
  const [buf, setBuf] = useState(null);
  return <input type="text" inputMode="decimal" className={p.className || ""} style={p.style}
    value={buf !== null ? buf : (value === "" || value === null || value === undefined ? "" : String(value).replace(".", ","))}
    onFocus={e=>setBuf(value===0?"":String(value ?? "").replace(".", ","))}
    onChange={e=>setBuf(e.target.value)}
    onBlur={e=>{ onChange(e.target.value === "" ? 0 : n(e.target.value)); setBuf(null); }}
    placeholder={p.placeholder} />;
}
function Sel({value, onChange, options, placeholder, ...p}){
  return <select value={value ?? ""} onChange={e=>onChange(e.target.value)} {...p}>
    {placeholder !== undefined && <option value="">{placeholder}</option>}
    {options.map(o => typeof o === "string"
      ? <option key={o} value={o}>{o}</option>
      : <option key={o.v} value={o.v}>{o.l}</option>)}
  </select>;
}
function Modal({title, onClose, children, footer, lg}){
  useEffect(()=>{ const h = e => e.key === "Escape" && onClose(); window.addEventListener("keydown",h); return ()=>window.removeEventListener("keydown",h); },[onClose]);
  return <div className="ovl" onMouseDown={e=>{ if(e.target === e.currentTarget) onClose(); }}>
    <div className={"modal"+(lg?" lg":"")} onMouseDown={e=>e.stopPropagation()}>
      <header><h3>{title}</h3><div className="spacer"/><button className="icobtn" onClick={onClose}>✕</button></header>
      <div className="body">{children}</div>
      {footer && <footer>{footer}</footer>}
    </div>
  </div>;
}
function Confirm({text, onYes, onClose, yesLabel="Elimina"}){
  return <Modal title="Confermi?" onClose={onClose} footer={<>
    <button className="btn" onClick={onClose}>Annulla</button>
    <button className="btn danger" onClick={()=>{onYes();onClose();}}>{yesLabel}</button>
  </>}><p style={{margin:0}}>{text}</p></Modal>;
}
function Empty({children, action}){
  return <div className="empty"><p>{children}</p>{action}</div>;
}
function MarginBar({v}){
  const p = Math.max(0, Math.min(1, n(v)));
  const cls = v < 0.2 ? "bad" : v < 0.4 ? "low" : "";
  return <div className="bar"><i className={cls} style={{width:(p*100)+"%"}}/></div>;
}

/* ============================ Excel: import generico ============================ */
const ALIASES = {
  descrizione: ["tipologia","articolo","descrizione","prodotto","materiale","voce","item","denominazione"],
  fornitore:   ["fornitore","supplier","venditore"],
  categoria:   ["categoria","reparto","famiglia","gruppo"],
  um:          ["um","u m","unita","unita misura","unita di misura","misura"],
  prezzo:      ["importo unitario","prezzo unitario","prezzo","imponibile","costo unitario netto","importo","prezzo netto","prezzo kg","prezzo l"],
  iva:         ["iva","aliquota","aliquota iva","iva %"],
  quantita:    ["quantita","qta","q ta","qty","pezzi","n pezzi","quantita ordine"],
  contenuto:   ["contenuto","peso cadauno g","volume cadauno l","contenuto unita","formato"],
  umBase:      ["um base","unita base","um di consumo"],
  prezzoVendita:["prezzo vendita","pv","prezzo di vendita","vendita"],
  note:        ["note","nota","commento","osservazioni"],
  ubicazione:  ["ubicazione","luogo","luogo di stoccaggio","magazzino","posizione","stoccaggio"],
  giacenza:    ["giacenza","esistenza","quantita a magazzino","stock"],
  codice:      ["codice","cod","sku","ean"]
};
function seqMatch(words, alias){
  const a = alias.split(" ").filter(Boolean);
  for (let i = 0; i + a.length <= words.length; i++){
    let ok = true;
    for (let j = 0; j < a.length; j++) if (words[i+j] !== a[j]){ ok = false; break; }
    if (ok) return true;
  }
  return false;
}
function matchHeader(cell){
  const w = norm(cell).split(" ").filter(Boolean);
  if (!w.length) return null;
  const k = w.join(" ");
  for (const field in ALIASES) if (ALIASES[field].some(a => k === a || k === a.replace(/ /g,""))) return field;
  for (const field in ALIASES) if (ALIASES[field].some(a => seqMatch(w, a))) return field;
  return null;
}
/* trova la riga di intestazione ovunque sia nel foglio e mappa le colonne */
function findTable(rows, required=["descrizione"]){
  let best = null;
  for (let r = 0; r < Math.min(rows.length, 40); r++){
    const row = rows[r] || [];
    const map = {};
    row.forEach((c, i) => { const f = matchHeader(c); if (f && map[f] === undefined) map[f] = i; });
    const score = Object.keys(map).length;
    if (required.every(f => map[f] !== undefined) && score >= 2 && (!best || score > best.score))
      best = {headerRow:r, map, score};
  }
  return best;
}
function readWorkbook(file){
  return new Promise((res, rej) => {
    const fr = new FileReader();
    fr.onload = e => { try{ res(XLSX.read(new Uint8Array(e.target.result), {type:"array"})); }catch(err){ rej(err); } };
    fr.onerror = rej;
    fr.readAsArrayBuffer(file);
  });
}
function sheetRows(wb, sheetName){
  const ws = wb.Sheets[sheetName || wb.SheetNames[0]];
  return XLSX.utils.sheet_to_json(ws, {header:1, blankrows:false, defval:null});
}
function parseRows(rows){
  const t = findTable(rows);
  if (!t) return {error:"Nessuna tabella riconosciuta: serve almeno una colonna ARTICOLO/TIPOLOGIA e una tra FORNITORE, IMPORTO UNITARIO, QUANTITÀ."};
  const out = [];
  for (let r = t.headerRow + 1; r < rows.length; r++){
    const row = rows[r] || [];
    const get = f => t.map[f] === undefined ? null : row[t.map[f]];
    const desc = get("descrizione");
    if (desc === null || desc === undefined || String(desc).trim() === "") continue;
    if (matchHeader(desc) === "descrizione") continue;      // intestazione ripetuta
    out.push({
      descrizione: String(desc).trim(),
      fornitore: get("fornitore") ? String(get("fornitore")).trim() : "",
      categoria: get("categoria") ? String(get("categoria")).trim() : "",
      um: get("um") ? String(get("um")).trim() : "",
      prezzo: n(get("prezzo")),
      iva: get("iva") === null ? null : parseIva(get("iva")),
      quantita: n(get("quantita")),
      contenuto: n(get("contenuto")),
      umBase: get("umBase") ? String(get("umBase")).trim() : "",
      prezzoVendita: n(get("prezzoVendita")),
      giacenza: n(get("giacenza")),
      ubicazione: get("ubicazione") ? String(get("ubicazione")).trim() : "",
      codice: get("codice") ? String(get("codice")).trim() : "",
      note: get("note") ? String(get("note")).trim() : ""
    });
  }
  return {rows: out, map: t.map, headerRow: t.headerRow};
}

function aoaToFile(sheets, filename){
  const wb = XLSX.utils.book_new();
  sheets.forEach(s => {
    const ws = XLSX.utils.aoa_to_sheet(s.aoa);
    ws["!cols"] = (s.cols || []).map(w => ({wch:w}));
    XLSX.utils.book_append_sheet(wb, ws, s.name.slice(0,31));
  });
  XLSX.writeFile(wb, filename);
}

/* ============================ PDF ============================ */
function pdfDoc(orientation="p"){
  const {jsPDF} = window.jspdf;
  return new jsPDF({orientation, unit:"mm", format:"a4"});
}
function pdfHead(doc, titolo, sottotitolo, meta){
  doc.setFillColor(18,32,47); doc.rect(0,0,doc.internal.pageSize.getWidth(),22,"F");
  doc.setTextColor(255,255,255); doc.setFont("times","bold"); doc.setFontSize(15);
  doc.text(titolo, 14, 10);
  doc.setFont("helvetica","normal"); doc.setFontSize(9); doc.setTextColor(200,210,220);
  if (sottotitolo) doc.text(sottotitolo, 14, 16);
  doc.setTextColor(30,30,30);
  let y = 30;
  if (meta && meta.length){
    doc.setFontSize(9);
    meta.forEach((m,i) => {
      const col = i % 3, row = Math.floor(i/3);
      const x = 14 + col * ((doc.internal.pageSize.getWidth()-28)/3);
      doc.setTextColor(120,125,130); doc.text(m[0], x, 29 + row*9);
      doc.setTextColor(25,30,38); doc.setFont("helvetica","bold"); doc.text(String(m[1] ?? "—"), x, 34 + row*9);
      doc.setFont("helvetica","normal");
      y = Math.max(y, 40 + row*9);
    });
  }
  return y;
}
function pdfTable(doc, head, body, startY, opts={}){
  doc.autoTable({
    head:[head], body, startY,
    theme:"grid", styles:{fontSize:8.2, cellPadding:1.7, lineColor:[220,218,210], textColor:[30,35,42]},
    headStyles:{fillColor:[236,234,227], textColor:[40,48,58], fontStyle:"bold", lineColor:[210,208,200]},
    alternateRowStyles:{fillColor:[250,249,246]},
    margin:{left:14,right:14,bottom:16},
    ...opts
  });
  return doc.lastAutoTable.finalY;
}
function pdfFooter(doc){
  const p = doc.internal.getNumberOfPages();
  for (let i=1;i<=p;i++){
    doc.setPage(i);
    doc.setFontSize(8); doc.setTextColor(140,145,150);
    doc.text("Generato il "+dmy(today())+" · Master", 14, doc.internal.pageSize.getHeight()-8);
    doc.text(i+"/"+p, doc.internal.pageSize.getWidth()-14, doc.internal.pageSize.getHeight()-8, {align:"right"});
  }
}

/* ============================ calcoli ============================ */
function rigaTot(r){
  const cu = n(r.prezzo) * (1 + parseIva(r.iva));
  return {costoUnitario:cu, imponibile:n(r.prezzo)*n(r.quantita), iva:cu*n(r.quantita)-n(r.prezzo)*n(r.quantita), totale:cu*n(r.quantita)};
}
function ordineTot(o){
  return (o.righe||[]).reduce((acc,r) => {
    const t = rigaTot(r);
    acc.imponibile += t.imponibile; acc.iva += t.iva; acc.totale += t.totale; acc.righe++;
    acc.pezzi += n(r.quantita);
    return acc;
  }, {imponibile:0, iva:0, totale:0, righe:0, pezzi:0});
}
function costoProdotto(p, artById){
  return (p.componenti||[]).reduce((s,c) => {
    if (c.costoManuale !== null && c.costoManuale !== undefined && c.costoManuale !== "") return s + n(c.costoManuale);
    const a = artById[c.articoloId];
    return s + (a ? costoBase(a) * n(c.qta) : 0);
  }, 0);
}
function margini(p, artById){
  const costo = costoProdotto(p, artById);
  const pv = n(p.prezzoVendita);
  const ricavo = pv / (1 + parseIva(p.ivaVendita));
  const mu = ricavo - costo;
  return {costo, pv, ricavo, mu, pctPv: ricavo ? mu/ricavo : 0, ricarico: costo ? mu/costo : 0};
}
function giacenzeMap(movimenti){
  const m = {};
  (movimenti||[]).forEach(mv => {
    const q = n(mv.quantita) * (mv.tipo === "Scarico" ? -1 : 1);
    const k = mv.articoloId + "|" + (mv.ubicazioneId || "");
    m[k] = (m[k] || 0) + q;
    if (mv.tipo === "Trasferimento" && mv.ubicazioneDest){
      const k2 = mv.articoloId + "|" + mv.ubicazioneDest;
      m[k] = (m[k] || 0) - n(mv.quantita) * 2;
      m[k2] = (m[k2] || 0) + n(mv.quantita);
    }
  });
  return m;
}

          <header><h3>Spesa aperta per fornitore</h3></header>
          <div className="body">
            {forn.length === 0 ? <span className="muted small">Ancora nessun dato.</span> : forn.map(([k,v]) =>
              <div key={k} style={{display:"grid",gridTemplateColumns:"130px 1fr 86px",gap:10,alignItems:"center",marginBottom:8}}>
                <span className="small" style={{overflow:"hidden",textOverflow:"ellipsis",whiteSpace:"nowrap"}}>{k}</span>
                <div className="bar"><i style={{width:(v/maxF*100)+"%",background:"var(--ink-3)"}}/></div>
                <span className="num t-right">{eur(v,0)}</span>
              </div>)}
          </div>
        </div>

        <div className="card">
          <header><h3>Margini più bassi</h3><div className="spacer"/><button className="btn sm" onClick={()=>setTab("margini")}>Apri</button></header>
          {peggiori.length === 0
            ? <Empty>Inserisci prezzi di vendita per vedere i margini.</Empty>
            : <table><thead><tr><th>Prodotto</th><th className="t-right">Costo</th><th className="t-right">Prezzo</th><th className="t-right">Margine</th></tr></thead>
              <tbody>{peggiori.map(({p,m}) => <tr key={p.id}>
                <td>{p.nome}</td>
                <td className="t-right num">{eur(m.costo)}</td>
                <td className="t-right num">{eur(m.pv)}</td>
                <td className="t-right num"><span className={m.mu>=0?"pos":"neg"}>{pct(m.pctPv)}</span></td>
              </tr>)}</tbody></table>}
        </div>

        <div className="card">
          <header><h3>Sotto scorta</h3><div className="spacer"/><button className="btn sm" onClick={()=>setTab("magazzino")}>Apri</button></header>
          {sottoScorta.length === 0
            ? <Empty>Nessun articolo sotto la scorta minima.</Empty>
            : <table><thead><tr><th>Articolo</th><th className="t-right">Giacenza</th><th className="t-right">Minimo</th></tr></thead>
              <tbody>{sottoScorta.slice(0,10).map(({a,q}) => <tr key={a.id}>
                <td>{a.descrizione}</td><td className="t-right num">{num(q,0)}</td><td className="t-right num">{num(a.scortaMin,0)}</td>
              </tr>)}</tbody></table>}
        </div>
      </div>
    </div>
  </>;
}

/* ============================ ORDINI ============================ */
function nuovoOrdine(ordini){
  const anno = new Date().getFullYear();
  const num = ordini.filter(o => (o.numero||"").includes(String(anno))).length + 1;
  return {
    id: uid(), numero: String(num).padStart(3,"0")+"/"+anno, titolo:"", fornitore:"", data: today(),
    dataConsegna:"", evento:"", stato:"Bozza", note:"", ubicazioneId:"", ricevutoIl:"", righe:[]
  };
}
function rigaDaArticolo(a){
  return {id:uid(), articoloId:a.id, descrizione:a.descrizione, fornitore:a.fornitore, categoria:a.categoria,
          um:a.um, prezzo:n(a.prezzo), iva:parseIva(a.iva), quantita:1, note:""};
}

function Ordini({ctx}){
  const {ordini, setOrdini, toast} = ctx;
  const [openIds, setOpenIds] = useState(() => { try{ return JSON.parse(localStorage.getItem(LS_PREFIX+"openOrd") || "[]"); }catch(e){ return []; } });
  const [activeId, setActiveId] = useState(null);
  const [q, setQ] = useState("");
  const [filtroStato, setFiltroStato] = useState("");
  const [del, setDel] = useState(null);
  const [selO, setSelO] = useState([]);
  const [delSelO, setDelSelO] = useState(false);

  useEffect(() => { localStorage.setItem(LS_PREFIX+"openOrd", JSON.stringify(openIds)); }, [openIds]);
  useEffect(() => { setOpenIds(ids => ids.filter(id => ordini.some(o => o.id === id))); }, [ordini.length]);

  const open = id => { setOpenIds(ids => ids.includes(id) ? ids : [...ids, id]); setActiveId(id); };
  const close = id => { setOpenIds(ids => ids.filter(x => x !== id)); setActiveId(a => a === id ? null : a); };
  const patch = (id, p) => setOrdini(list => list.map(o => o.id === id ? {...o, ...p} : o));

  const creaOrdine = () => { const o = nuovoOrdine(ordini); setOrdini(l => [o, ...l]); open(o.id); toast("Ordine creato","ok"); };
  const duplica = o => {
    const c = {...clone(o), id: uid(), numero: nuovoOrdine(ordini).numero, titolo: (o.titolo||"Ordine")+" (copia)",
               stato:"Bozza", data: today(), ricevutoIl:"", righe:(o.righe||[]).map(r => ({...r, id: uid()}))};
    setOrdini(l => [c, ...l]); open(c.id); toast("Ordine duplicato","ok");
  };

  const lista = ordini.filter(o => byText(q, o.titolo, o.numero, o.fornitore, o.evento) && (!filtroStato || o.stato === filtroStato));
  const attivo = ordini.find(o => o.id === activeId);
  const openOrds = openIds.map(id => ordini.find(o => o.id === id)).filter(Boolean);

  return <>
    <Top title="Ordini" hint={ordini.length + " ordini · " + openOrds.length + " aperti"}>
      <button className="btn" onClick={templateOrdine}>Scarica modello Excel</button>
      <button className="btn gold" onClick={creaOrdine}>Nuovo ordine</button>
    </Top>

    {openOrds.length > 0 && <div className="otabs">
      <div className={"otab"+(activeId===null?" on":"")} onClick={()=>setActiveId(null)}>Elenco</div>
      {openOrds.map(o => <div key={o.id} className={"otab"+(activeId===o.id?" on":"")} onClick={()=>setActiveId(o.id)}>
        <span>{o.titolo || o.numero}</span>
        <span className="num">{eur(ordineTot(o).totale,0)}</span>
        <span className="x" onClick={e=>{e.stopPropagation();close(o.id);}}>✕</span>
      </div>)}
    </div>}

    <div className="wrap">
      {attivo
        ? <OrdineEditor key={attivo.id} ordine={attivo} patch={p => patch(attivo.id, p)} ctx={ctx} onClose={()=>close(attivo.id)}/>
        : <>
          <div className="toolbar">
            <div className="search"><input value={q} onChange={e=>setQ(e.target.value)} placeholder="Cerca per titolo, numero, fornitore…"/></div>
            <Sel value={filtroStato} onChange={setFiltroStato} options={STATI} placeholder="Tutti gli stati" style={{width:150}}/>
            <div className="spacer"/>
            {selO.length > 0 && <>
              <span className="tag b">{selO.length} selezionati</span>
              <button className="btn sm" onClick={()=>setSelO([])}>Deseleziona</button>
              <button className="btn sm danger" onClick={()=>setDelSelO(true)}>Elimina selezionati</button>
            </>}
            <button className="btn" onClick={()=>esportaElencoOrdini(ordini)}>Esporta elenco</button>
          </div>
          <div className="card">
            {lista.length === 0
              ? <Empty action={<button className="btn gold" onClick={creaOrdine}>Crea il primo ordine</button>}>Nessun ordine da mostrare.</Empty>
              : <div className="scroll"><table>
                <thead><tr>
                  <th className="t-center" style={{width:34}} onClick={e=>e.stopPropagation()}>
                    <input type="checkbox" style={{width:"auto"}} title="Seleziona tutti"
                      checked={lista.length > 0 && lista.every(o => selO.includes(o.id))}
                      onChange={e=>setSelO(e.target.checked
                        ? [...new Set([...selO, ...lista.map(o => o.id)])]
                        : selO.filter(id => !lista.some(o => o.id === id)))}/>
                  </th>
                  <th>Numero</th><th>Titolo</th><th>Fornitore</th><th>Evento</th><th>Data</th><th>Consegna</th>
                  <th>Stato</th><th className="t-right">Righe</th><th className="t-right">Imponibile</th><th className="t-right">Totale</th><th></th>
                </tr></thead>
                <tbody>{lista.map(o => { const t = ordineTot(o); return <tr key={o.id} style={{cursor:"pointer", ...(selO.includes(o.id)?{background:"var(--gold-soft)"}:{})}} onClick={()=>open(o.id)}>
                  <td className="t-center" onClick={e=>e.stopPropagation()}>
                    <input type="checkbox" style={{width:"auto"}} checked={selO.includes(o.id)}
                      onChange={e=>setSelO(e.target.checked ? [...selO, o.id] : selO.filter(id => id !== o.id))}/>
                  </td>
                  <td className="num">{o.numero}</td>
                  <td><strong>{o.titolo || "—"}</strong></td>
                  <td>{o.fornitore || "—"}</td>
                  <td className="small">{o.evento || "—"}</td>
                  <td className="num">{dmy(o.data)}</td>
                  <td className="num">{dmy(o.dataConsegna)}</td>
                  <td><span className={"tag "+(STATO_CLS[o.stato]||"")}>{o.stato}</span></td>
                  <td className="t-right num">{t.righe}</td>
                  <td className="t-right num">{eur(t.imponibile)}</td>
                  <td className="t-right num"><strong>{eur(t.totale)}</strong></td>
                  <td className="t-right" onClick={e=>e.stopPropagation()}>
                    <button className="icobtn" title="Duplica" onClick={()=>duplica(o)}>⧉</button>
                    <button className="icobtn del" title="Elimina" onClick={()=>setDel(o)}>🗑</button>
                  </td>
                </tr>; })}</tbody>
              </table></div>}
          </div>
        </>}
    </div>

    {del && <Confirm text={`Elimini l'ordine "${del.titolo || del.numero}" e tutte le sue righe?`}
      onClose={()=>setDel(null)} onYes={()=>{ setOrdini(l => l.filter(o => o.id !== del.id)); close(del.id); toast("Ordine eliminato"); }}/>}
    {delSelO && <Confirm yesLabel={"Elimina "+selO.length+" ordini"}
      text={`Elimini ${selO.length} ordini con tutte le loro righe?`}
      onClose={()=>setDelSelO(false)}
      onYes={()=>{ setOrdini(l => l.filter(o => !selO.includes(o.id))); selO.forEach(close); toast(selO.length+" ordini eliminati"); setSelO([]); }}/>}
  </>;
}

function OrdineEditor({ordine, patch, ctx, onClose}){
  const {articoli, fornNomi, ubicazioni, setArticoli, setMovimenti, artById, toast} = ctx;
  const [imp, setImp] = useState(null);
  const [ricevi, setRicevi] = useState(false);
  const [selR, setSelR] = useState([]);
  const [delSelR, setDelSelR] = useState(false);
  const t = ordineTot(ordine);
  const righe = ordine.righe || [];
  const setRighe = f => patch({righe: typeof f === "function" ? f(righe) : f});
  const setRiga = (id, p) => setRighe(rs => rs.map(r => r.id === id ? {...r, ...p} : r));

  const addVuota = () => setRighe(rs => [...rs, {id:uid(), articoloId:"", descrizione:"", fornitore:ordine.fornitore||"", categoria:"", um:"pz", prezzo:0, iva:0.22, quantita:1, note:""}]);
  const addArticolo = artId => {
    const a = artById[artId]; if (!a) return;
    setRighe(rs => {
      const ex = rs.find(r => r.articoloId === artId);
      if (ex) return rs.map(r => r.id === ex.id ? {...r, quantita: n(r.quantita) + 1} : r);
      return [...rs, rigaDaArticolo(a)];
    });
  };
  const collegaArticolo = (rigaId, artId) => {
    const a = artById[artId]; if (!a) { setRiga(rigaId, {articoloId:""}); return; }
    setRiga(rigaId, {articoloId:a.id, descrizione:a.descrizione, fornitore:a.fornitore, categoria:a.categoria, um:a.um, prezzo:n(a.prezzo), iva:parseIva(a.iva)});
  };

  const suggeriti = useMemo(() => {
    const f = norm(ordine.fornitore);
    return articoli.filter(a => a.attivo !== false && (!f || norm(a.fornitore) === f));
  }, [articoli, ordine.fornitore]);

  const registraMagazzino = ubicazioneId => {
    const movs = righe.filter(r => r.articoloId && n(r.quantita) > 0).map(r => ({
      id: uid(), data: today(), tipo:"Carico", articoloId: r.articoloId, quantita: n(r.quantita),
      ubicazioneId, valoreUnitario: n(r.prezzo) * (1 + parseIva(r.iva)), ordineId: ordine.id,
      note: "Ordine " + (ordine.numero || "")
    }));
    if (!movs.length){ toast("Nessuna riga collegata a un articolo dell'anagrafica","err"); return; }
    setMovimenti(l => [...movs, ...l]);
    patch({stato:"Ricevuto", ricevutoIl: today(), ubicazioneId});
    setRicevi(false);
    toast(movs.length + " carichi registrati a magazzino","ok");
  };

  return <>
    <div className="card" style={{marginBottom:14}}>
      <div className="body">
        <div className="formgrid">
          <Field label="Numero"><Txt value={ordine.numero} onChange={v=>patch({numero:v})}/></Field>
          <Field label="Titolo" style={{gridColumn:"span 2"}}><Txt value={ordine.titolo} onChange={v=>patch({titolo:v})} placeholder="es. Ordine Ghidoni IV 2026"/></Field>
          <Field label="Fornitore">
            <input list="forn-list" value={ordine.fornitore || ""} onChange={e=>patch({fornitore:e.target.value})}/>
            <datalist id="forn-list">{fornNomi.map(f => <option key={f} value={f}/>)}</datalist>
          </Field>
          <Field label="Evento / destinazione"><Txt value={ordine.evento} onChange={v=>patch({evento:v})} placeholder="es. Torneo del Prete 2026"/></Field>
          <Field label="Data ordine"><input type="date" value={ordine.data || ""} onChange={e=>patch({data:e.target.value})}/></Field>
          <Field label="Consegna prevista"><input type="date" value={ordine.dataConsegna || ""} onChange={e=>patch({dataConsegna:e.target.value})}/></Field>
          <Field label="Stato"><Sel value={ordine.stato} onChange={v=>patch({stato:v})} options={STATI}/></Field>
        </div>
        <div style={{marginTop:12}}>
          <Field label="Note"><textarea value={ordine.note || ""} onChange={e=>patch({note:e.target.value})} style={{minHeight:48}}/></Field>
        </div>
      </div>
    </div>

    <div className="card">
      <header>
        <h3>Righe dell'ordine</h3>
        <span className="muted small">{t.righe} righe · {num(t.pezzi,0)} pezzi</span>
        <div className="spacer"/>
        {selR.length > 0 && <>
          <span className="tag b">{selR.length} selezionate</span>
          <button className="btn sm" onClick={()=>setSelR([])}>Deseleziona</button>
          <button className="btn sm danger" onClick={()=>setDelSelR(true)}>Elimina selezionate</button>
        </>}
        <button className="btn sm" onClick={addVuota}>+ Riga</button>
        <button className="btn sm" onClick={()=>setImp("ordine")}>Importa Excel</button>
        <button className="btn sm" onClick={templateOrdine}>Modello</button>
        <button className="btn sm" onClick={()=>esportaOrdineExcel(ordine)}>Excel</button>
        <button className="btn sm pri" onClick={()=>esportaOrdinePdf(ordine)}>PDF</button>
        <button className="btn sm gold" onClick={()=>setRicevi(true)}>Carica a magazzino</button>
      </header>

      <div className="body" style={{paddingBottom:8}}>
        <div style={{display:"flex",gap:8,alignItems:"center",flexWrap:"wrap"}}>
          <span className="small muted">Aggiungi dall'anagrafica:</span>
          <select value="" onChange={e=>{ addArticolo(e.target.value); e.target.value=""; }} style={{maxWidth:420}}>
            <option value="">Scegli un articolo…</option>
            {suggeriti.map(a => <option key={a.id} value={a.id}>{a.descrizione}{a.fornitore?" · "+a.fornitore:""} — {eur(costoUn(a))}</option>)}
          </select>
        </div>
      </div>

      {righe.length === 0
        ? <Empty action={<div className="btnrow"><button className="btn" onClick={addVuota}>Aggiungi una riga</button><button className="btn" onClick={()=>setImp("ordine")}>Importa da Excel</button></div>}>
            L'ordine è vuoto.
          </Empty>
        : <div className="scroll"><table>
            <thead><tr>
              <th className="t-center" style={{width:34}}>
                <input type="checkbox" style={{width:"auto"}} title="Seleziona tutte"
                  checked={righe.length > 0 && righe.every(r => selR.includes(r.id))}
                  onChange={e=>setSelR(e.target.checked ? righe.map(r => r.id) : [])}/>
              </th>
              <th style={{minWidth:230}}>Articolo</th><th style={{minWidth:120}}>Fornitore</th><th style={{width:62}}>UM</th>
              <th className="t-right" style={{width:104}}>Importo unit.</th><th className="t-right" style={{width:74}}>IVA</th>
              <th className="t-right" style={{width:88}}>Quantità</th><th className="t-right" style={{width:104}}>Costo unit.</th>
              <th className="t-right" style={{width:112}}>Costo totale</th><th style={{minWidth:120}}>Note</th><th style={{width:58}}></th>
            </tr></thead>
            <tbody>{righe.map((r,i) => { const rt = rigaTot(r); return <tr key={r.id} style={selR.includes(r.id)?{background:"var(--gold-soft)"}:null}>
              <td className="t-center">
                <input type="checkbox" style={{width:"auto"}} checked={selR.includes(r.id)}
                  onChange={e=>setSelR(e.target.checked ? [...selR, r.id] : selR.filter(id => id !== r.id))}/>
              </td>
              <td>
                <input className="cellinput" list={"art-"+ordine.id} value={r.descrizione || ""}
                  onChange={e=>{
                    const v = e.target.value;
                    const a = articoli.find(x => x.descrizione === v);
                    if (a) collegaArticolo(r.id, a.id); else setRiga(r.id, {descrizione:v, articoloId:""});
                  }}/>
                {!r.articoloId && r.descrizione && <span className="tag" style={{fontSize:10,marginTop:2}}>fuori anagrafica</span>}
              </td>
              <td><input className="cellinput" list="forn-list" value={r.fornitore || ""} onChange={e=>setRiga(r.id,{fornitore:e.target.value})}/></td>
              <td><input className="cellinput" list="um-list" value={r.um || ""} onChange={e=>setRiga(r.id,{um:e.target.value})}/></td>
              <td><Num className="cellinput n" value={r.prezzo} onChange={v=>setRiga(r.id,{prezzo:v})}/></td>
              <td><Num className="cellinput n" value={Math.round(parseIva(r.iva)*10000)/100} onChange={v=>setRiga(r.id,{iva:parseIva(v)})}/></td>
              <td><Num className="cellinput n" value={r.quantita} onChange={v=>setRiga(r.id,{quantita:v})}/></td>
              <td className="t-right num muted">{num(rt.costoUnitario,4)}</td>
              <td className="t-right num"><strong>{eur(rt.totale)}</strong></td>
              <td><input className="cellinput" value={r.note || ""} onChange={e=>setRiga(r.id,{note:e.target.value})}/></td>
              <td className="t-right">
                <button className="icobtn" title="Duplica riga" onClick={()=>setRighe(rs => [...rs.slice(0,i+1), {...r, id:uid()}, ...rs.slice(i+1)])}>⧉</button>
                <button className="icobtn del" title="Elimina riga" onClick={()=>setRighe(rs => rs.filter(x => x.id !== r.id))}>✕</button>
              </td>
            </tr>; })}</tbody>
            <tfoot><tr>
              <td colSpan={7}>Totali</td>
              <td className="t-right">Imponibile</td>
              <td className="t-right num">{eur(t.imponibile)}</td><td colSpan={2}></td>
            </tr><tr>
              <td colSpan={7}></td><td className="t-right">IVA</td><td className="t-right num">{eur(t.iva)}</td><td colSpan={2}></td>
            </tr><tr>
              <td colSpan={7}></td><td className="t-right">Totale</td>
              <td className="t-right num" style={{fontSize:15}}>{eur(t.totale)}</td><td colSpan={2}></td>
            </tr></tfoot>
          </table></div>}
      <datalist id={"art-"+ordine.id}>{articoli.map(a => <option key={a.id} value={a.descrizione}/>)}</datalist>
      <datalist id="um-list">{UM_LIST.map(u => <option key={u} value={u}/>)}</datalist>
    </div>

    <div className="btnrow" style={{marginTop:14}}>
      <button className="btn" onClick={onClose}>Chiudi scheda</button>
    </div>

    {delSelR && <Confirm yesLabel={"Elimina "+selR.length+" righe"}
      text={`Elimini ${selR.length} righe da questo ordine?`}
      onClose={()=>setDelSelR(false)}
      onYes={()=>{ setRighe(rs => rs.filter(r => !selR.includes(r.id))); toast(selR.length+" righe eliminate"); setSelR([]); }}/>}
    {imp && <ImportModal ctx={ctx} onClose={()=>setImp(null)} onDone={(nuove, modo) => {
      setRighe(rs => modo === "replace" ? nuove : [...rs, ...nuove]);
      setImp(null);
    }}/>}
    {ricevi && <Modal title="Carico a magazzino" onClose={()=>setRicevi(false)} footer={
      <><button className="btn" onClick={()=>setRicevi(false)}>Annulla</button></>}>
      <p className="small muted" style={{marginTop:0}}>Ogni riga collegata a un articolo dell'anagrafica genera un movimento di carico. L'ordine passa in stato “Ricevuto”.</p>
      {ubicazioni.length === 0
        ? <Empty>Prima crea un luogo di stoccaggio in Magazzino → Luoghi.</Empty>
        : <div className="grid" style={{gap:8}}>
            {ubicazioni.map(u => <button key={u.id} className="btn" style={{justifyContent:"space-between"}} onClick={()=>registraMagazzino(u.id)}>
              <span><strong>{u.nome}</strong> <span className="muted small">{u.tipo}</span></span><span>Carica qui →</span>
            </button>)}
          </div>}
    </Modal>}
  </>;
}

/* ============================ import Excel (righe ordine) ============================ */
function ImportModal({ctx, onClose, onDone}){
  const {articoli, setArticoli, toast} = ctx;
  const [wb, setWb] = useState(null);
  const [sheet, setSheet] = useState("");
  const [parsed, setParsed] = useState(null);
  const [modo, setModo] = useState("append");
  const [creaMancanti, setCreaMancanti] = useState(true);
  const fileRef = useRef(null);

  const analizza = (workbook, nome) => {
    const res = parseRows(sheetRows(workbook, nome));
    setParsed(res);
  };
  const onFile = async e => {
    const f = e.target.files[0]; if (!f) return;
    try{
      const workbook = await readWorkbook(f);
      setWb(workbook);
      const first = workbook.SheetNames[0];
      setSheet(first);
      analizza(workbook, first);
    }catch(err){ toast("File non leggibile: "+err.message, "err"); }
  };

  const match = useMemo(() => {
    if (!parsed || !parsed.rows) return null;
    const idx = {}; articoli.forEach(a => idx[norm(a.descrizione)] = a);
    return parsed.rows.map(r => ({...r, art: idx[norm(r.descrizione)] || null}));
  }, [parsed, articoli]);

  const conferma = () => {
    if (!match) return;
    let nuoviArt = [];
    const righe = match.map(r => {
      let art = r.art;
      if (!art && creaMancanti){
        art = {id:uid(), codice:r.codice||"", descrizione:r.descrizione, fornitore:r.fornitore, categoria:r.categoria,
               um:r.um||"pz", prezzo:r.prezzo, iva:r.iva === null ? 0.22 : r.iva, contenuto:r.contenuto || 1,
               umBase:r.umBase||r.um||"pz", prezzoVendita:r.prezzoVendita||0, scortaMin:0, cespite:false, note:"", attivo:true};
        nuoviArt.push(art);
      }
      return {id:uid(), articoloId: art ? art.id : "", descrizione:r.descrizione, fornitore:r.fornitore || (art?art.fornitore:""),
              categoria:r.categoria || (art?art.categoria:""), um:r.um || (art?art.um:"pz"),
              prezzo: r.prezzo || (art ? n(art.prezzo) : 0),
              iva: r.iva === null ? (art ? parseIva(art.iva) : 0.22) : r.iva,
              quantita: r.quantita, note:r.note};
    });
    if (nuoviArt.length) setArticoli(l => [...l, ...nuoviArt]);
    toast(righe.length + " righe importate" + (nuoviArt.length ? " · " + nuoviArt.length + " articoli creati" : ""), "ok");
    onDone(righe, modo);
  };

  const nuovi = match ? match.filter(r => !r.art).length : 0;

  return <Modal lg title="Importa righe da Excel" onClose={onClose} footer={<>
    <button className="btn" onClick={onClose}>Annulla</button>
    <button className="btn gold" disabled={!match || !match.length} onClick={conferma}>Importa {match ? match.length : 0} righe</button>
  </>}>
    <div className="btnrow" style={{marginBottom:14}}>
      <button className="btn pri" onClick={()=>fileRef.current.click()}>Scegli file .xlsx</button>
      <button className="btn" onClick={templateOrdine}>Scarica il modello</button>
      <input ref={fileRef} type="file" accept=".xlsx,.xls,.csv" style={{display:"none"}} onChange={onFile}/>
    </div>
    <p className="small muted" style={{marginTop:0}}>
      Riconosco le intestazioni ovunque si trovino nel foglio: ARTICOLO/TIPOLOGIA, FORNITORE, IMPORTO UNITARIO, IVA, QUANTITÀ, UM, NOTE.
      Puoi quindi importare anche i tuoi fogli esistenti, non solo il modello.
    </p>

    {wb && <div className="formgrid" style={{marginBottom:14}}>
      <Field label="Foglio"><Sel value={sheet} onChange={v=>{setSheet(v); analizza(wb, v);}} options={wb.SheetNames}/></Field>
      <Field label="Come importare"><Sel value={modo} onChange={setModo} options={[{v:"append",l:"Aggiungi alle righe esistenti"},{v:"replace",l:"Sostituisci tutte le righe"}]}/></Field>
      <Field label="Articoli non in anagrafica">
        <label className="small" style={{display:"flex",gap:6,alignItems:"center",fontWeight:400,color:"var(--text)"}}>
          <input type="checkbox" style={{width:"auto"}} checked={creaMancanti} onChange={e=>setCreaMancanti(e.target.checked)}/>
          Creali in anagrafica ({nuovi})
        </label>
      </Field>
    </div>}

    {parsed && parsed.error && <div className="tag r" style={{display:"block",padding:"8px 10px"}}>{parsed.error}</div>}

    {match && <div className="card"><div className="scroll" style={{maxHeight:320}}><table>
      <thead><tr><th>Articolo</th><th>Fornitore</th><th className="t-right">Importo</th><th className="t-right">IVA</th><th className="t-right">Qtà</th><th className="t-right">Totale</th><th></th></tr></thead>
      <tbody>{match.map((r,i) => { const cu = r.prezzo*(1+(r.iva===null?0.22:r.iva)); return <tr key={i}>
        <td>{r.descrizione}</td><td>{r.fornitore || "—"}</td>
        <td className="t-right num">{num(r.prezzo,4)}</td>
        <td className="t-right num">{r.iva === null ? "—" : pct(r.iva)}</td>
        <td className="t-right num">{num(r.quantita,0)}</td>
        <td className="t-right num">{eur(cu*r.quantita)}</td>
        <td>{r.art ? <span className="tag g">in anagrafica</span> : <span className="tag b">nuovo</span>}</td>
      </tr>; })}</tbody>
    </table></div></div>}
  </Modal>;
}

function esportaOrdineExcel(o){
  const t = ordineTot(o);
  const head = [...TEMPLATE_HEAD, "COSTO UNITARIO", "COSTO TOTALE"];
  const body = (o.righe||[]).map(r => {
    const rt = rigaTot(r);
    return [r.descrizione, r.fornitore, r.categoria, r.um, n(r.prezzo), Math.round(parseIva(r.iva)*10000)/100, n(r.quantita), r.note, rt.costoUnitario, rt.totale];
  });
  const aoa = [
    ["ORDINE", o.numero || "", "", "", "", "", "", "", "", ""],
    ["Titolo", o.titolo || ""], ["Fornitore", o.fornitore || ""], ["Evento", o.evento || ""],
    ["Data", dmy(o.data)], ["Consegna prevista", dmy(o.dataConsegna)], ["Stato", o.stato || ""],
    ["Note", o.note || ""], [],
    head, ...body, [],
    ["", "", "", "", "", "", "", "", "Imponibile", t.imponibile],
    ["", "", "", "", "", "", "", "", "IVA", t.iva],
    ["", "", "", "", "", "", "", "", "Totale", t.totale]
  ];
  aoaToFile([{name:"ORDINE", cols:[38,16,16,8,16,8,12,24,16,16], aoa}], "ordine_"+slug(o.titolo || o.numero)+".xlsx");
