/* ============================ ARTICOLI ============================ */
function Articoli({ctx}){
  const {articoli, setArticoli, fornNomi, categorie, toast} = ctx;
  const [q, setQ] = useState("");
  const [fCat, setFCat] = useState("");
  const [fForn, setFForn] = useState("");
  const [del, setDel] = useState(null);
  const [delSel, setDelSel] = useState(false);
  const [sel, setSel] = useState([]);
  const [imp, setImp] = useState(false);
  const fileRef = useRef(null);

  const lista = articoli.filter(a => byText(q, a.descrizione, a.codice, a.fornitore, a.categoria)
    && (!fCat || a.categoria === fCat) && (!fForn || a.fornitore === fForn));

  const tuttiSel = lista.length > 0 && lista.every(a => sel.includes(a.id));
  const set = (id, p) => setArticoli(l => l.map(a => a.id === id ? {...a, ...p} : a));
  const aggiungi = () => {
    const a = {id:uid(), codice:"", descrizione:"Nuovo articolo", categoria:fCat||"", fornitore:fForn||"", um:"pz",
               prezzo:0, iva:0.22, contenuto:1, umBase:"pz", prezzoVendita:0, scortaMin:0, cespite:false, note:"", attivo:true};
    setArticoli(l => [a, ...l]);
  };
  const importa = async e => {
    const f = e.target.files[0]; if (!f) return;
    try{
      const wb = await readWorkbook(f);
      const res = parseRows(sheetRows(wb, wb.SheetNames[0]));
      if (res.error){ toast(res.error, "err"); return; }
      const idx = {}; articoli.forEach(a => idx[norm(a.descrizione)] = a);
      let nuovi = 0, agg = 0;
      const next = [...articoli];
      res.rows.forEach(r => {
        const ex = idx[norm(r.descrizione)];
        if (ex){
          const i = next.findIndex(a => a.id === ex.id);
          next[i] = {...next[i],
            fornitore: r.fornitore || next[i].fornitore, categoria: r.categoria || next[i].categoria,
            um: r.um || next[i].um, prezzo: r.prezzo || next[i].prezzo,
            iva: r.iva === null ? next[i].iva : r.iva,
            contenuto: r.contenuto || next[i].contenuto,
            umBase: r.umBase || next[i].umBase,
            prezzoVendita: r.prezzoVendita || next[i].prezzoVendita};
          agg++;
        } else {
          next.push({id:uid(), codice:r.codice||"", descrizione:r.descrizione, categoria:r.categoria, fornitore:r.fornitore,
            um:r.um||"pz", prezzo:r.prezzo, iva:r.iva === null ? 0.22 : r.iva, contenuto:r.contenuto||1, umBase:r.umBase||r.um||"pz",
            prezzoVendita:r.prezzoVendita||0, scortaMin:0, cespite:false, note:r.note||"", attivo:true});
          nuovi++;
        }
      });
      setArticoli(next);
      toast(nuovi+" articoli nuovi · "+agg+" aggiornati", "ok");
    }catch(err){ toast("File non leggibile: "+err.message, "err"); }
    e.target.value = "";
  };
  const esporta = () => {
    const aoa = [["CODICE","ARTICOLO","CATEGORIA","FORNITORE","UM","IMPORTO UNITARIO","IVA %","CONTENUTO","UM BASE","COSTO UNITARIO","COSTO PER UM BASE","PREZZO VENDITA","SCORTA MINIMA","CESPITE","NOTE"]];
    articoli.forEach(a => aoa.push([a.codice, a.descrizione, a.categoria, a.fornitore, a.um, n(a.prezzo),
      Math.round(parseIva(a.iva)*10000)/100, n(a.contenuto)||1, a.umBase||a.um, costoUn(a), costoBase(a),
      n(a.prezzoVendita), n(a.scortaMin), a.cespite?"SI":"", a.note]));
    aoaToFile([{name:"ARTICOLI", cols:[12,38,18,18,8,16,8,12,10,16,18,16,14,10,24], aoa}], "articoli.xlsx");
  };

  return <>
    <Top title="Articoli" hint={articoli.length + " articoli in anagrafica"}>
      <button className="btn" onClick={templateArticoli}>Modello</button>
      <button className="btn" onClick={()=>fileRef.current.click()}>Importa Excel</button>
      <button className="btn" onClick={esporta}>Esporta Excel</button>
      <button className="btn gold" onClick={aggiungi}>Nuovo articolo</button>
      <input ref={fileRef} type="file" accept=".xlsx,.xls,.csv" style={{display:"none"}} onChange={importa}/>
    </Top>
    <div className="wrap">
      <div className="toolbar">
        <div className="search"><input value={q} onChange={e=>setQ(e.target.value)} placeholder="Cerca articolo, codice, fornitore…"/></div>
        <Sel value={fCat} onChange={setFCat} options={categorie} placeholder="Tutte le categorie" style={{width:180}}/>
        <Sel value={fForn} onChange={setFForn} options={fornNomi} placeholder="Tutti i fornitori" style={{width:180}}/>
        <div className="spacer"/>
        {sel.length > 0 && <>
          <span className="tag b">{sel.length} selezionati</span>
          <button className="btn sm" onClick={()=>setSel([])}>Deseleziona</button>
          <button className="btn sm danger" onClick={()=>setDelSel(true)}>Elimina selezionati</button>
        </>}
        <span className="small muted">{lista.length} risultati</span>
      </div>

      <div className="card">
        {lista.length === 0
          ? <Empty action={<div className="btnrow"><button className="btn gold" onClick={aggiungi}>Nuovo articolo</button><button className="btn" onClick={()=>fileRef.current.click()}>Importa da Excel</button></div>}>
              Nessun articolo.
            </Empty>
          : <div className="scroll"><table>
            <thead><tr>
              <th className="t-center" style={{width:34}}>
                <input type="checkbox" style={{width:"auto"}} checked={tuttiSel} title="Seleziona tutti"
                  onChange={e=>setSel(e.target.checked
                    ? [...new Set([...sel, ...lista.map(a => a.id)])]
                    : sel.filter(id => !lista.some(a => a.id === id)))}/>
              </th>
              <th style={{width:88}}>Codice</th><th style={{minWidth:220}}>Articolo</th><th style={{minWidth:130}}>Categoria</th>
              <th style={{minWidth:130}}>Fornitore</th><th style={{width:58}}>UM</th>
              <th className="t-right" style={{width:100}}>Imp. unit.</th><th className="t-right" style={{width:66}}>IVA</th>
              <th className="t-right" style={{width:96}}>Costo unit.</th>
              <th className="t-right" style={{width:86}}>Contenuto</th><th style={{width:64}}>UM base</th>
              <th className="t-right" style={{width:100}}>Costo/UM base</th>
              <th className="t-right" style={{width:92}}>Pr. vendita</th><th className="t-right" style={{width:78}}>Scorta min</th>
              <th className="t-center" style={{width:64}}>Cespite</th><th style={{width:40}}></th>
            </tr></thead>
            <tbody>{lista.map(a => <tr key={a.id} style={sel.includes(a.id)?{background:"var(--gold-soft)"}:null}>
              <td className="t-center">
                <input type="checkbox" style={{width:"auto"}} checked={sel.includes(a.id)}
                  onChange={e=>setSel(e.target.checked ? [...sel, a.id] : sel.filter(id => id !== a.id))}/>
              </td>
              <td><input className="cellinput" value={a.codice||""} onChange={e=>set(a.id,{codice:e.target.value})}/></td>
              <td><input className="cellinput" value={a.descrizione||""} onChange={e=>set(a.id,{descrizione:e.target.value})}/></td>
              <td><input className="cellinput" list="cat-list" value={a.categoria||""} onChange={e=>set(a.id,{categoria:e.target.value})}/></td>
              <td><input className="cellinput" list="forn-list" value={a.fornitore||""} onChange={e=>set(a.id,{fornitore:e.target.value})}/></td>
              <td><input className="cellinput" list="um-list" value={a.um||""} onChange={e=>set(a.id,{um:e.target.value})}/></td>
              <td><Num className="cellinput n" value={a.prezzo} onChange={v=>set(a.id,{prezzo:v})}/></td>
              <td><Num className="cellinput n" value={Math.round(parseIva(a.iva)*10000)/100} onChange={v=>set(a.id,{iva:parseIva(v)})}/></td>
              <td className="t-right num muted">{num(costoUn(a),4)}</td>
              <td><Num className="cellinput n" value={a.contenuto} onChange={v=>set(a.id,{contenuto:v})}/></td>
              <td><input className="cellinput" list="um-list" value={a.umBase||""} onChange={e=>set(a.id,{umBase:e.target.value})}/></td>
              <td className="t-right num">{num(costoBase(a),4)}</td>
              <td><Num className="cellinput n" value={a.prezzoVendita} onChange={v=>set(a.id,{prezzoVendita:v})}/></td>
              <td><Num className="cellinput n" value={a.scortaMin} onChange={v=>set(a.id,{scortaMin:v})}/></td>
              <td className="t-center"><input type="checkbox" style={{width:"auto"}} checked={!!a.cespite} onChange={e=>set(a.id,{cespite:e.target.checked})}/></td>
              <td className="t-right"><button className="icobtn del" onClick={()=>setDel(a)}>🗑</button></td>
            </tr>)}</tbody>
          </table></div>}
      </div>
      <p className="small muted" style={{marginTop:10,maxWidth:720}}>
        <strong>Contenuto</strong> e <strong>UM base</strong> servono ai calcoli di marginalità: una bottiglia da 1 litro ha contenuto 1 e UM base “l”, un cartone di salsiccia da 1&nbsp;kg ha contenuto 1000 e UM base “g”.
        Il costo per UM base è quello usato nelle ricette.
      </p>
      <datalist id="cat-list">{categorie.map(c => <option key={c} value={c}/>)}</datalist>
      <datalist id="forn-list">{fornNomi.map(f => <option key={f} value={f}/>)}</datalist>
      <datalist id="um-list">{UM_LIST.map(u => <option key={u} value={u}/>)}</datalist>
    </div>
    {del && <Confirm text={`Elimini "${del.descrizione}" dall'anagrafica?`} onClose={()=>setDel(null)}
      onYes={()=>{ setArticoli(l => l.filter(x => x.id !== del.id)); setSel(v => v.filter(id => id !== del.id)); toast("Articolo eliminato"); }}/>}
    {delSel && <Confirm yesLabel={"Elimina "+sel.length+" articoli"}
      text={`Elimini ${sel.length} articoli dall'anagrafica? Gli ordini già compilati restano, ma le righe perdono il collegamento.`}
      onClose={()=>setDelSel(false)}
      onYes={()=>{ setArticoli(l => l.filter(a => !sel.includes(a.id))); toast(sel.length+" articoli eliminati"); setSel([]); }}/>}
  </>;
}

/* ============================ MARGINALITÀ ============================ */
function Margini({ctx}){
  const {prodotti, setProdotti, articoli, artById, toast} = ctx;
  const [q, setQ] = useState("");
  const [apri, setApri] = useState(null);
  const [del, setDel] = useState(null);
  const [ord, setOrd] = useState("margine");

  const set = (id, p) => setProdotti(l => l.map(x => x.id === id ? {...x, ...p} : x));
  const aggiungi = () => {
    const p = {id:uid(), nome:"Nuovo prodotto", categoria:"", prezzoVendita:0, ivaVendita:0, stima:0, note:"", componenti:[]};
    setProdotti(l => [p, ...l]); setApri(p.id);
  };
  const cats = [...new Set(prodotti.map(p => p.categoria).filter(Boolean))].sort();

  const righe = prodotti.filter(p => byText(q, p.nome, p.categoria))
    .map(p => ({p, m: margini(p, artById)}))
    .sort((a,b) => ord === "margine" ? a.m.pctPv - b.m.pctPv
                 : ord === "margineDesc" ? b.m.pctPv - a.m.pctPv
                 : ord === "contributo" ? (b.m.mu * n(b.p.stima)) - (a.m.mu * n(a.p.stima))
                 : String(a.p.nome).localeCompare(b.p.nome));

  const tot = righe.reduce((s,r) => { s.ricavo += r.m.ricavo * n(r.p.stima); s.costo += r.m.costo * n(r.p.stima); s.mu += r.m.mu * n(r.p.stima); return s; }, {ricavo:0,costo:0,mu:0});
  const conStima = righe.some(r => n(r.p.stima) > 0);

  const esportaExcel = () => {
    const aoa = [["PRODOTTO","CATEGORIA","COSTO","PREZZO VENDITA","IVA VENDITA %","RICAVO NETTO","MARGINE UNITARIO","MARGINE %","RICARICO %","QTÀ STIMATA","MARGINE TOTALE"]];
    righe.forEach(({p,m}) => aoa.push([p.nome, p.categoria, m.costo, m.pv, Math.round(parseIva(p.ivaVendita)*10000)/100, m.ricavo, m.mu, m.pctPv, m.ricarico, n(p.stima), m.mu*n(p.stima)]));
    const dist = [["PRODOTTO","COMPONENTE","QUANTITÀ","UM BASE","COSTO/UM BASE","COSTO RIGA"]];
    prodotti.forEach(p => (p.componenti||[]).forEach(c => {
      const a = artById[c.articoloId];
      const cu = c.costoManuale != null && c.costoManuale !== "" ? n(c.costoManuale)/(n(c.qta)||1) : (a ? costoBase(a) : 0);
      dist.push([p.nome, a ? a.descrizione : c.descrizione, n(c.qta), a ? (a.umBase||a.um) : "", cu, cu*n(c.qta)]);
    }));
    aoaToFile([{name:"MARGINALITÀ", cols:[32,16,12,14,14,14,16,12,12,12,16], aoa},
               {name:"DISTINTE", cols:[32,34,12,10,16,14], aoa:dist}], "marginalita.xlsx");
  };
  const esportaPdf = () => {
    const doc = pdfDoc("l");
    let y = pdfHead(doc, "Marginalità prodotti", "Costi di distinta e prezzi di vendita", [
      ["Prodotti", String(righe.length)],
      ["Margine medio", righe.length ? pct(righe.reduce((s,r)=>s+r.m.pctPv,0)/righe.length) : "—"],
      ["Margine su stima", conStima ? num(tot.mu,2)+" EUR" : "—"]
    ]);
    pdfTable(doc, ["Prodotto","Categoria","Costo","Prezzo","Margine u.","Margine %","Ricarico","Qtà stimata","Margine tot."],
      righe.map(({p,m}) => [p.nome, p.categoria || "", num(m.costo,3), num(m.pv,2), num(m.mu,3), pct(m.pctPv), pct(m.ricarico), num(p.stima,0), num(m.mu*n(p.stima),2)]),
      y + 4, {columnStyles:{2:{halign:"right"},3:{halign:"right"},4:{halign:"right"},5:{halign:"right"},6:{halign:"right"},7:{halign:"right"},8:{halign:"right",fontStyle:"bold"}}});
    pdfFooter(doc);
    doc.save("marginalita.pdf");
  };

  const aperto = prodotti.find(p => p.id === apri);

  return <>
    <Top title="Marginalità" hint={prodotti.length + " prodotti a listino"}>
      <button className="btn" onClick={esportaExcel}>Excel</button>
      <button className="btn" onClick={esportaPdf}>PDF</button>
      <button className="btn gold" onClick={aggiungi}>Nuovo prodotto</button>
    </Top>
    <div className="wrap">
      <div className="kpis" style={{marginBottom:14}}>
        <div className="kpi acc"><div className="lab">Margine medio</div><div className="val">{righe.length ? pct(righe.reduce((s,r)=>s+r.m.pctPv,0)/righe.length) : "—"}</div><div className="sub">su {righe.length} prodotti</div></div>
        <div className="kpi"><div className="lab">Ricavo stimato</div><div className="val">{eur(tot.ricavo,0)}</div><div className="sub">quantità × prezzo netto</div></div>
        <div className="kpi"><div className="lab">Costo stimato</div><div className="val">{eur(tot.costo,0)}</div><div className="sub">materia prima e consumo</div></div>
        <div className="kpi"><div className="lab">Margine stimato</div><div className="val">{eur(tot.mu,0)}</div><div className="sub">{tot.ricavo ? pct(tot.mu/tot.ricavo) : "—"} sul ricavo</div></div>
      </div>

      <div className="toolbar">
        <div className="search"><input value={q} onChange={e=>setQ(e.target.value)} placeholder="Cerca prodotto…"/></div>
        <Sel value={ord} onChange={setOrd} options={[{v:"margine",l:"Margine crescente"},{v:"margineDesc",l:"Margine decrescente"},{v:"contributo",l:"Contributo totale"},{v:"nome",l:"Nome"}]} style={{width:200}}/>
        <div className="spacer"/>
        <span className="small muted">Compila “Qtà stimata” per vedere il margine complessivo dell'evento.</span>
      </div>

      <div className="card">
        {righe.length === 0
          ? <Empty action={<button className="btn gold" onClick={aggiungi}>Nuovo prodotto</button>}>Nessun prodotto a listino.</Empty>
          : <div className="scroll"><table>
            <thead><tr>
              <th style={{minWidth:200}}>Prodotto</th><th style={{minWidth:120}}>Categoria</th>
              <th className="t-right" style={{width:96}}>Costo</th><th className="t-right" style={{width:96}}>Prezzo</th>
              <th className="t-right" style={{width:76}}>IVA vend.</th><th className="t-right" style={{width:96}}>Margine u.</th>
              <th style={{width:150}}>Margine %</th><th className="t-right" style={{width:84}}>Ricarico</th>
              <th className="t-right" style={{width:88}}>Qtà stim.</th><th className="t-right" style={{width:104}}>Margine tot.</th><th style={{width:74}}></th>
            </tr></thead>
            <tbody>{righe.map(({p,m}) => <tr key={p.id}>
              <td><input className="cellinput" value={p.nome||""} onChange={e=>set(p.id,{nome:e.target.value})}/>
                  <div className="small muted" style={{paddingLeft:5}}>{(p.componenti||[]).length} componenti</div></td>
              <td><input className="cellinput" list="pcat-list" value={p.categoria||""} onChange={e=>set(p.id,{categoria:e.target.value})}/></td>
              <td className="t-right num">{num(m.costo,3)}</td>
              <td><Num className="cellinput n" value={p.prezzoVendita} onChange={v=>set(p.id,{prezzoVendita:v})}/></td>
              <td><Num className="cellinput n" value={Math.round(parseIva(p.ivaVendita)*10000)/100} onChange={v=>set(p.id,{ivaVendita:parseIva(v)})}/></td>
              <td className="t-right num"><span className={m.mu>=0?"pos":"neg"}>{num(m.mu,3)}</span></td>
              <td><div style={{display:"flex",gap:8,alignItems:"center"}}><MarginBar v={m.pctPv}/><span className="num">{m.pv?pct(m.pctPv):"—"}</span></div></td>
              <td className="t-right num">{m.costo?pct(m.ricarico):"—"}</td>
              <td><Num className="cellinput n" value={p.stima} onChange={v=>set(p.id,{stima:v})}/></td>
              <td className="t-right num"><strong>{eur(m.mu*n(p.stima),0)}</strong></td>
              <td className="t-right">
                <button className="icobtn" title="Distinta" onClick={()=>setApri(p.id)}>✎</button>
                <button className="icobtn" title="Duplica" onClick={()=>setProdotti(l=>[{...clone(p), id:uid(), nome:p.nome+" (copia)", componenti:(p.componenti||[]).map(c=>({...c,id:uid()}))}, ...l])}>⧉</button>
                <button className="icobtn del" onClick={()=>setDel(p)}>🗑</button>
              </td>
            </tr>)}</tbody>
            {conStima && <tfoot><tr>
              <td colSpan={8}>Totale su quantità stimate</td>
              <td className="t-right num">{num(righe.reduce((s,r)=>s+n(r.p.stima),0),0)}</td>
              <td className="t-right num">{eur(tot.mu,0)}</td><td></td>
            </tr></tfoot>}
          </table></div>}
      </div>
      <datalist id="pcat-list">{cats.map(c => <option key={c} value={c}/>)}</datalist>
    </div>

    {aperto && <Distinta prodotto={aperto} set={p => set(aperto.id, p)} ctx={ctx} onClose={()=>setApri(null)}/>}
    {del && <Confirm text={`Elimini "${del.nome}"?`} onClose={()=>setDel(null)}
      onYes={()=>{ setProdotti(l => l.filter(x => x.id !== del.id)); toast("Prodotto eliminato"); }}/>}
  </>;
}

function Distinta({prodotto, set, ctx, onClose}){
  const {articoli, artById} = ctx;
  const comp = prodotto.componenti || [];
  const setComp = f => set({componenti: typeof f === "function" ? f(comp) : f});
  const m = margini(prodotto, artById);

  return <Modal lg title={"Distinta · " + prodotto.nome} onClose={onClose} footer={<button className="btn pri" onClick={onClose}>Chiudi</button>}>
    <div className="formgrid" style={{marginBottom:14}}>
      <Field label="Prodotto"><Txt value={prodotto.nome} onChange={v=>set({nome:v})}/></Field>
      <Field label="Categoria"><Txt value={prodotto.categoria} onChange={v=>set({categoria:v})}/></Field>
      <Field label="Prezzo di vendita"><Num value={prodotto.prezzoVendita} onChange={v=>set({prezzoVendita:v})}/></Field>
      <Field label="IVA vendita %"><Num value={Math.round(parseIva(prodotto.ivaVendita)*10000)/100} onChange={v=>set({ivaVendita:parseIva(v)})}/></Field>
      <Field label="Quantità stimata"><Num value={prodotto.stima} onChange={v=>set({stima:v})}/></Field>
    </div>

    <div className="btnrow" style={{marginBottom:10}}>
      <select value="" style={{maxWidth:420}} onChange={e=>{
        const a = artById[e.target.value]; if(!a) return;
        setComp(c => [...c, {id:uid(), articoloId:a.id, descrizione:a.descrizione, qta:1, costoManuale:null}]);
        e.target.value="";
      }}>
        <option value="">Aggiungi componente dall'anagrafica…</option>
        {articoli.map(a => <option key={a.id} value={a.id}>{a.descrizione} — {num(costoBase(a),4)} €/{a.umBase||a.um}</option>)}
      </select>
      <button className="btn sm" onClick={()=>setComp(c => [...c, {id:uid(), articoloId:"", descrizione:"Voce di costo", qta:1, costoManuale:0}])}>+ Costo manuale</button>
    </div>

    {comp.length === 0
      ? <Empty>Nessun componente: il costo del prodotto è zero.</Empty>
      : <table>
        <thead><tr><th>Componente</th><th className="t-right" style={{width:100}}>Quantità</th><th style={{width:70}}>UM</th>
          <th className="t-right" style={{width:110}}>Costo/UM</th><th className="t-right" style={{width:100}}>Costo</th><th style={{width:36}}></th></tr></thead>
        <tbody>{comp.map(c => {
          const a = artById[c.articoloId];
          const manuale = c.costoManuale !== null && c.costoManuale !== undefined && c.costoManuale !== "";
          const cu = manuale ? n(c.costoManuale)/(n(c.qta)||1) : (a ? costoBase(a) : 0);
          const costo = manuale ? n(c.costoManuale) : cu * n(c.qta);
          return <tr key={c.id}>
            <td>{a ? a.descrizione : <input className="cellinput" value={c.descrizione||""} onChange={e=>setComp(l=>l.map(x=>x.id===c.id?{...x,descrizione:e.target.value}:x))}/>}</td>
            <td><Num className="cellinput n" value={c.qta} onChange={v=>setComp(l=>l.map(x=>x.id===c.id?{...x,qta:v}:x))}/></td>
            <td className="small muted">{a ? (a.umBase||a.um) : "—"}</td>
            <td className="t-right">{manuale
              ? <Num className="cellinput n" value={c.costoManuale} onChange={v=>setComp(l=>l.map(x=>x.id===c.id?{...x,costoManuale:v}:x))}/>
              : <span className="num muted">{num(cu,4)}</span>}</td>
            <td className="t-right num"><strong>{num(costo,4)}</strong></td>
            <td className="t-right"><button className="icobtn del" onClick={()=>setComp(l=>l.filter(x=>x.id!==c.id))}>✕</button></td>
          </tr>;
        })}</tbody>
        <tfoot><tr><td colSpan={4}>Costo del prodotto</td><td className="t-right num">{num(m.costo,4)}</td><td></td></tr></tfoot>
      </table>}

    <div className="kpis" style={{marginTop:16}}>
      <div className="kpi"><div className="lab">Ricavo netto</div><div className="val">{eur(m.ricavo)}</div></div>
      <div className="kpi"><div className="lab">Margine unitario</div><div className="val"><span className={m.mu>=0?"pos":"neg"}>{eur(m.mu)}</span></div></div>
      <div className="kpi acc"><div className="lab">Margine sul prezzo</div><div className="val">{m.pv?pct(m.pctPv):"—"}</div><div className="sub">ricarico {m.costo?pct(m.ricarico):"—"}</div></div>
      <div className="kpi"><div className="lab">Margine su {num(prodotto.stima,0)} pezzi</div><div className="val">{eur(m.mu*n(prodotto.stima),0)}</div></div>
    </div>
  </Modal>;
}

/* ============================ MAGAZZINO ============================ */
const TIPI_MOV = ["Carico","Scarico","Rettifica","Trasferimento"];

function Magazzino({ctx}){
  const [sub, setSub] = useState("giacenze");
  const subs = [["giacenze","Giacenze"],["movimenti","Movimenti"],["luoghi","Luoghi di stoccaggio"],["cespiti","Cespiti"]];
  return <>
    <Top title="Magazzino" hint="Giacenze per luogo, movimenti e beni durevoli">
      {subs.map(([k,l]) => <button key={k} className={"btn"+(sub===k?" pri":"")} onClick={()=>setSub(k)}>{l}</button>)}
    </Top>
    <div className="wrap">
      {sub==="giacenze"  && <Giacenze ctx={ctx}/>}
      {sub==="movimenti" && <Movimenti ctx={ctx}/>}
      {sub==="luoghi"    && <Luoghi ctx={ctx}/>}
      {sub==="cespiti"   && <Cespiti ctx={ctx}/>}
    </div>
  </>;
}

function Giacenze({ctx}){
  const {articoli, artById, ubicazioni, ubById, movimenti, setMovimenti, toast} = ctx;
  const [q, setQ] = useState("");
  const [fUb, setFUb] = useState("");
  const [soloDisp, setSoloDisp] = useState(true);
  const [rett, setRett] = useState(null);
  const fileRef = useRef(null);

  const gm = giacenzeMap(movimenti);
  const righe = Object.entries(gm).map(([k,qta]) => {
    const [aid, uid_] = k.split("|");
    const a = artById[aid];
    return a ? {key:k, a, u: ubById[uid_], qta, valore: costoUn(a)*qta} : null;
  }).filter(Boolean)
    .filter(r => byText(q, r.a.descrizione, r.a.categoria, r.a.fornitore))
    .filter(r => !fUb || (r.u && r.u.id === fUb))
    .filter(r => !soloDisp || Math.abs(r.qta) > 0.0001)
    .sort((x,y) => x.a.descrizione.localeCompare(y.a.descrizione));
  const valTot = righe.reduce((s,r) => s + r.valore, 0);

  const esporta = () => {
    const aoa = [["ARTICOLO","CATEGORIA","FORNITORE","UBICAZIONE","GIACENZA","UM","COSTO UNITARIO","VALORE","SCORTA MINIMA"]];
    righe.forEach(r => aoa.push([r.a.descrizione, r.a.categoria, r.a.fornitore, r.u?r.u.nome:"—", r.qta, r.a.um, costoUn(r.a), r.valore, n(r.a.scortaMin)]));
    aoa.push([], ["","","","TOTALE","","","",valTot,""]);
    aoaToFile([{name:"GIACENZE", cols:[36,16,18,20,12,8,16,14,14], aoa}], "magazzino.xlsx");
  };
  const esportaPdf = () => {
    const doc = pdfDoc("l");
    const y = pdfHead(doc, "Situazione di magazzino", "Giacenze per luogo di stoccaggio", [
      ["Posizioni", String(righe.length)], ["Valore totale", num(valTot,2)+" EUR"], ["Data", dmy(today())]
    ]);
    pdfTable(doc, ["Articolo","Categoria","Ubicazione","Giacenza","UM","Costo unit.","Valore"],
      righe.map(r => [r.a.descrizione, r.a.categoria||"", r.u?r.u.nome:"—", num(r.qta,2), r.a.um||"", num(costoUn(r.a),4), num(r.valore,2)]),
      y + 4, {columnStyles:{3:{halign:"right"},5:{halign:"right"},6:{halign:"right",fontStyle:"bold"}}});
    pdfFooter(doc); doc.save("magazzino.pdf");
  };
  const importa = async e => {
    const f = e.target.files[0]; if (!f) return;
    try{
      const wb = await readWorkbook(f);
      const res = parseRows(sheetRows(wb, wb.SheetNames[0]));
      if (res.error){ toast(res.error,"err"); return; }
      const idxA = {}; articoli.forEach(a => idxA[norm(a.descrizione)] = a);
      const idxU = {}; ubicazioni.forEach(u => idxU[norm(u.nome)] = u);
      const movs = [];
      res.rows.forEach(r => {
        const a = idxA[norm(r.descrizione)];
        const qta = r.giacenza || r.quantita;
        if (!a || !qta) return;
        const u = idxU[norm(r.ubicazione)] || ubicazioni[0];
        movs.push({id:uid(), data:today(), tipo:"Rettifica", articoloId:a.id, quantita:qta,
                   ubicazioneId:u?u.id:"", valoreUnitario:costoUn(a), note:"Import giacenze"});
      });
      if (!movs.length){ toast("Nessuna riga abbinata all'anagrafica articoli","err"); return; }
      setMovimenti(l => [...movs, ...l]);
      toast(movs.length+" giacenze importate","ok");
    }catch(err){ toast("File non leggibile: "+err.message,"err"); }
    e.target.value = "";
  };

  return <>
    <div className="kpis" style={{marginBottom:14}}>
      <div className="kpi acc"><div className="lab">Valore di magazzino</div><div className="val">{eur(valTot,0)}</div><div className="sub">{righe.length} posizioni</div></div>
      <div className="kpi"><div className="lab">Luoghi</div><div className="val">{ubicazioni.length}</div><div className="sub">{ubicazioni.map(u=>u.nome).slice(0,2).join(", ") || "nessuno"}</div></div>
      <div className="kpi"><div className="lab">Movimenti</div><div className="val">{movimenti.length}</div></div>
    </div>
    <div className="toolbar">
      <div className="search"><input value={q} onChange={e=>setQ(e.target.value)} placeholder="Cerca articolo…"/></div>
      <Sel value={fUb} onChange={setFUb} options={ubicazioni.map(u=>({v:u.id,l:u.nome}))} placeholder="Tutti i luoghi" style={{width:180}}/>
      <label className="small" style={{display:"flex",gap:6,alignItems:"center"}}>
        <input type="checkbox" style={{width:"auto"}} checked={soloDisp} onChange={e=>setSoloDisp(e.target.checked)}/> Solo con giacenza
      </label>
      <div className="spacer"/>
      <button className="btn" onClick={templateMagazzino}>Modello</button>
      <button className="btn" onClick={()=>fileRef.current.click()}>Importa</button>
      <button className="btn" onClick={esporta}>Excel</button>
      <button className="btn" onClick={esportaPdf}>PDF</button>
      <input ref={fileRef} type="file" accept=".xlsx,.xls,.csv" style={{display:"none"}} onChange={importa}/>
    </div>

    <div className="card">
      {righe.length === 0
        ? <Empty>Nessuna giacenza: carica un ordine ricevuto oppure importa le giacenze iniziali.</Empty>
        : <div className="scroll"><table>
          <thead><tr><th>Articolo</th><th>Categoria</th><th>Luogo</th><th className="t-right">Giacenza</th><th>UM</th>
            <th className="t-right">Scorta min</th><th className="t-right">Costo unit.</th><th className="t-right">Valore</th><th style={{width:40}}></th></tr></thead>
          <tbody>{righe.map(r => <tr key={r.key}>
            <td>{r.a.descrizione}{r.a.cespite && <span className="tag n" style={{marginLeft:6,fontSize:10}}>cespite</span>}</td>
            <td className="small">{r.a.categoria || "—"}</td>
            <td>{r.u ? r.u.nome : <span className="muted">non assegnato</span>}</td>
            <td className="t-right num">{n(r.a.scortaMin) > 0 && r.qta < n(r.a.scortaMin)
              ? <span className="neg">{num(r.qta,2)}</span> : num(r.qta,2)}</td>
            <td className="small">{r.a.um}</td>
            <td className="t-right num muted">{n(r.a.scortaMin) ? num(r.a.scortaMin,0) : "—"}</td>
            <td className="t-right num muted">{num(costoUn(r.a),4)}</td>
            <td className="t-right num"><strong>{eur(r.valore)}</strong></td>
            <td className="t-right"><button className="icobtn" title="Rettifica" onClick={()=>setRett(r)}>±</button></td>
          </tr>)}</tbody>
          <tfoot><tr><td colSpan={7}>Totale</td><td className="t-right num">{eur(valTot)}</td><td></td></tr></tfoot>
        </table></div>}
    </div>

    {rett && <RettificaModal riga={rett} onClose={()=>setRett(null)} onSave={(nuova, nota) => {
      const delta = nuova - rett.qta;
      if (!delta){ setRett(null); return; }
      setMovimenti(l => [{id:uid(), data:today(), tipo:"Rettifica", articoloId:rett.a.id, quantita:delta,
        ubicazioneId:rett.u?rett.u.id:"", valoreUnitario:costoUn(rett.a), note:nota||"Rettifica inventario"}, ...l]);
      setRett(null); toast("Giacenza aggiornata","ok");
    }}/>}
  </>;
}

function RettificaModal({riga, onClose, onSave}){
  const [v, setV] = useState(riga.qta);
  const [nota, setNota] = useState("");
  return <Modal title={"Rettifica · " + riga.a.descrizione} onClose={onClose} footer={<>
    <button className="btn" onClick={onClose}>Annulla</button>
    <button className="btn gold" onClick={()=>onSave(n(v), nota)}>Salva giacenza</button>
  </>}>
    <div className="formgrid">
      <Field label="Luogo"><input value={riga.u?riga.u.nome:"non assegnato"} disabled/></Field>
      <Field label="Giacenza rilevata"><Num value={v} onChange={setV}/></Field>
      <Field label="Nota"><Txt value={nota} onChange={setNota} placeholder="es. inventario del 12/09"/></Field>
    </div>
    <p className="small muted">Registro la differenza rispetto a {num(riga.qta,2)} come movimento di rettifica, così lo storico resta tracciato.</p>
  </Modal>;
}

function Movimenti({ctx}){
  const {movimenti, setMovimenti, articoli, artById, ubicazioni, ubById, ordini, toast} = ctx;
  const [q, setQ] = useState("");
  const [nuovo, setNuovo] = useState(null);
  const [del, setDel] = useState(null);

  const lista = movimenti
    .filter(m => { const a = artById[m.articoloId]; return byText(q, a?a.descrizione:"", m.note, m.tipo); })
    .sort((a,b) => String(b.data).localeCompare(String(a.data)));

  const vuoto = () => ({id:uid(), data:today(), tipo:"Carico", articoloId:"", quantita:1, ubicazioneId:ubicazioni[0]?ubicazioni[0].id:"", ubicazioneDest:"", valoreUnitario:0, note:""});
  const esporta = () => {
    const aoa = [["DATA","TIPO","ARTICOLO","QUANTITÀ","LUOGO","LUOGO DESTINAZIONE","VALORE UNITARIO","VALORE","ORDINE","NOTE"]];
    lista.forEach(m => { const a = artById[m.articoloId]; const o = ordini.find(x=>x.id===m.ordineId);
      aoa.push([dmy(m.data), m.tipo, a?a.descrizione:"—", n(m.quantita), ubById[m.ubicazioneId]?ubById[m.ubicazioneId].nome:"", 
                ubById[m.ubicazioneDest]?ubById[m.ubicazioneDest].nome:"", n(m.valoreUnitario), n(m.valoreUnitario)*n(m.quantita), o?(o.titolo||o.numero):"", m.note]); });
    aoaToFile([{name:"MOVIMENTI", cols:[12,14,36,12,18,18,16,14,22,26], aoa}], "movimenti_magazzino.xlsx");
  };

  return <>
    <div className="toolbar">
      <div className="search"><input value={q} onChange={e=>setQ(e.target.value)} placeholder="Cerca movimento…"/></div>
      <div className="spacer"/>
      <button className="btn" onClick={esporta}>Esporta Excel</button>
      <button className="btn gold" onClick={()=>setNuovo(vuoto())}>Nuovo movimento</button>
    </div>
    <div className="card">
      {lista.length === 0
        ? <Empty action={<button className="btn gold" onClick={()=>setNuovo(vuoto())}>Registra un movimento</button>}>Nessun movimento registrato.</Empty>
        : <div className="scroll"><table>
          <thead><tr><th style={{width:96}}>Data</th><th style={{width:120}}>Tipo</th><th>Articolo</th>
            <th className="t-right" style={{width:96}}>Quantità</th><th>Luogo</th><th className="t-right" style={{width:104}}>Valore</th><th>Note</th><th style={{width:40}}></th></tr></thead>
          <tbody>{lista.map(m => { const a = artById[m.articoloId]; return <tr key={m.id}>
            <td className="num">{dmy(m.data)}</td>
            <td><span className={"tag "+(m.tipo==="Carico"?"g":m.tipo==="Scarico"?"r":"n")}>{m.tipo}</span></td>
            <td>{a ? a.descrizione : <span className="muted">articolo rimosso</span>}</td>
            <td className="t-right num">{m.tipo==="Scarico"?"−":"+"}{num(m.quantita,2)}</td>
            <td className="small">{ubById[m.ubicazioneId] ? ubById[m.ubicazioneId].nome : "—"}{m.ubicazioneDest && ubById[m.ubicazioneDest] ? " → "+ubById[m.ubicazioneDest].nome : ""}</td>
            <td className="t-right num muted">{eur(n(m.valoreUnitario)*n(m.quantita))}</td>
            <td className="small muted">{m.note}</td>
            <td className="t-right"><button className="icobtn del" onClick={()=>setDel(m)}>🗑</button></td>
          </tr>; })}</tbody>
        </table></div>}
    </div>

    {nuovo && <Modal title="Nuovo movimento" onClose={()=>setNuovo(null)} footer={<>
      <button className="btn" onClick={()=>setNuovo(null)}>Annulla</button>
      <button className="btn gold" disabled={!nuovo.articoloId} onClick={()=>{ setMovimenti(l=>[nuovo,...l]); setNuovo(null); toast("Movimento registrato","ok"); }}>Salva</button>
    </>}>
      <div className="formgrid">
        <Field label="Data"><input type="date" value={nuovo.data} onChange={e=>setNuovo({...nuovo, data:e.target.value})}/></Field>
        <Field label="Tipo"><Sel value={nuovo.tipo} onChange={v=>setNuovo({...nuovo, tipo:v})} options={TIPI_MOV}/></Field>
        <Field label="Articolo" style={{gridColumn:"span 2"}}>
          <Sel value={nuovo.articoloId} placeholder="Scegli…" options={articoli.map(a=>({v:a.id,l:a.descrizione}))}
            onChange={v=>{ const a = artById[v]; setNuovo({...nuovo, articoloId:v, valoreUnitario: a?costoUn(a):0}); }}/>
        </Field>
        <Field label="Quantità"><Num value={nuovo.quantita} onChange={v=>setNuovo({...nuovo, quantita:v})}/></Field>
        <Field label="Luogo"><Sel value={nuovo.ubicazioneId} placeholder="—" options={ubicazioni.map(u=>({v:u.id,l:u.nome}))} onChange={v=>setNuovo({...nuovo, ubicazioneId:v})}/></Field>
        {nuovo.tipo === "Trasferimento" && <Field label="Verso"><Sel value={nuovo.ubicazioneDest} placeholder="—" options={ubicazioni.map(u=>({v:u.id,l:u.nome}))} onChange={v=>setNuovo({...nuovo, ubicazioneDest:v})}/></Field>}
        <Field label="Valore unitario"><Num value={nuovo.valoreUnitario} onChange={v=>setNuovo({...nuovo, valoreUnitario:v})}/></Field>
        <Field label="Note" style={{gridColumn:"span 2"}}><Txt value={nuovo.note} onChange={v=>setNuovo({...nuovo, note:v})}/></Field>
      </div>
    </Modal>}
    {del && <Confirm text="Elimini questo movimento? Le giacenze verranno ricalcolate." onClose={()=>setDel(null)}
      onYes={()=>{ setMovimenti(l => l.filter(x => x.id !== del.id)); toast("Movimento eliminato"); }}/>}
  </>;
}

function Luoghi({ctx}){
  const {ubicazioni, setUbicazioni, movimenti, artById, toast} = ctx;
  const [del, setDel] = useState(null);
  const gm = giacenzeMap(movimenti);
  const valore = uId => Object.entries(gm).filter(([k]) => k.endsWith("|"+uId))
    .reduce((s,[k,q]) => { const a = artById[k.split("|")[0]]; return s + (a ? costoUn(a)*q : 0); }, 0);
  const set = (id,p) => setUbicazioni(l => l.map(u => u.id===id?{...u,...p}:u));

  return <>
    <div className="toolbar">
      <span className="small muted">I luoghi di stoccaggio si usano nei carichi, negli inventari e nei trasferimenti.</span>
      <div className="spacer"/>
      <button className="btn gold" onClick={()=>setUbicazioni(l => [...l, {id:uid(), nome:"Nuovo luogo", tipo:"Magazzino", indirizzo:"", responsabile:"", note:""}])}>Nuovo luogo</button>
    </div>
    <div className="card">
      {ubicazioni.length === 0
        ? <Empty>Nessun luogo di stoccaggio.</Empty>
        : <table>
          <thead><tr><th style={{minWidth:180}}>Nome</th><th style={{width:150}}>Tipo</th><th>Indirizzo</th><th style={{minWidth:130}}>Responsabile</th><th>Note</th>
            <th className="t-right" style={{width:120}}>Valore stoccato</th><th style={{width:40}}></th></tr></thead>
          <tbody>{ubicazioni.map(u => <tr key={u.id}>
            <td><input className="cellinput" value={u.nome||""} onChange={e=>set(u.id,{nome:e.target.value})}/></td>
            <td><input className="cellinput" list="tipo-ub" value={u.tipo||""} onChange={e=>set(u.id,{tipo:e.target.value})}/></td>
            <td><input className="cellinput" value={u.indirizzo||""} onChange={e=>set(u.id,{indirizzo:e.target.value})}/></td>
            <td><input className="cellinput" value={u.responsabile||""} onChange={e=>set(u.id,{responsabile:e.target.value})}/></td>
            <td><input className="cellinput" value={u.note||""} onChange={e=>set(u.id,{note:e.target.value})}/></td>
            <td className="t-right num">{eur(valore(u.id),0)}</td>
            <td className="t-right"><button className="icobtn del" onClick={()=>setDel(u)}>🗑</button></td>
          </tr>)}</tbody>
        </table>}
    </div>
    <datalist id="tipo-ub">{["Magazzino","Frigo","Cella","Furgone","Container","Bar","Cucina","Deposito esterno"].map(t => <option key={t} value={t}/>)}</datalist>
    {del && <Confirm text={`Elimini "${del.nome}"? I movimenti collegati resteranno senza luogo.`} onClose={()=>setDel(null)}
      onYes={()=>{ setUbicazioni(l => l.filter(u => u.id !== del.id)); toast("Luogo eliminato"); }}/>}
  </>;
}

function Cespiti({ctx}){
  const {articoli, setArticoli, ubicazioni, ubById, toast} = ctx;
  const lista = articoli.filter(a => a.cespite);
  const set = (id,p) => setArticoli(l => l.map(a => a.id===id?{...a,...p}:a));
  const esporta = () => {
    const aoa = [["CODICE","DESCRIZIONE","CATEGORIA CESPITE","FORNITORE","DATA ACQUISTO","QUANTITÀ","VALORE UNITARIO","VALORE TOTALE","ALIQUOTA AMM. %","CONTO CONTABILE","LUOGO","NOTE"]];
    lista.forEach(a => aoa.push([a.codice, a.descrizione, a.cespCategoria||"", a.fornitore, dmy(a.cespData), n(a.cespQta)||1,
      n(a.cespValore)||costoUn(a), (n(a.cespQta)||1)*(n(a.cespValore)||costoUn(a)), n(a.cespAliquota), a.cespConto||"",
      ubById[a.cespUbicazione]?ubById[a.cespUbicazione].nome:"", a.note||""]));
    aoaToFile([{name:"CESPITI", cols:[12,36,20,18,14,10,16,16,14,18,18,24], aoa}], "cespiti.xlsx");
  };
  const esportaJson = () => {
    const data = lista.map(a => ({descrizione:a.descrizione, categoria:a.cespCategoria||"", dataAcquisto:a.cespData||"",
      quantita:n(a.cespQta)||1, valoreUnitario:n(a.cespValore)||costoUn(a),
      valore:(n(a.cespQta)||1)*(n(a.cespValore)||costoUn(a)), aliquota:n(a.cespAliquota), conto:a.cespConto||"",
      luogo: ubById[a.cespUbicazione]?ubById[a.cespUbicazione].nome:"", fornitore:a.fornitore||""}));
    download(new Blob([JSON.stringify(data,null,2)],{type:"application/json"}), "cespiti.json");
    toast("File pronto per la contabilità","ok");
  };
  const totale = lista.reduce((s,a) => s + (n(a.cespQta)||1)*(n(a.cespValore)||costoUn(a)), 0);

  return <>
    <div className="toolbar">
      <span className="small muted">Sono cespiti gli articoli con la spunta “Cespite” in anagrafica: attrezzature, frigoriferi, spillatori, gazebo.</span>
      <div className="spacer"/>
      <button className="btn" onClick={esportaJson}>JSON per contabilità</button>
      <button className="btn" onClick={esporta}>Esporta Excel</button>
    </div>
    <div className="kpis" style={{marginBottom:14}}>
      <div className="kpi acc"><div className="lab">Valore dei cespiti</div><div className="val">{eur(totale,0)}</div><div className="sub">{lista.length} beni</div></div>
    </div>
    <div className="card">
      {lista.length === 0
        ? <Empty>Nessun cespite. Spunta “Cespite” su un articolo in anagrafica per farlo comparire qui.</Empty>
        : <div className="scroll"><table>
          <thead><tr><th style={{minWidth:200}}>Bene</th><th style={{minWidth:140}}>Categoria cespite</th><th style={{width:130}}>Data acquisto</th>
            <th className="t-right" style={{width:76}}>Qtà</th><th className="t-right" style={{width:110}}>Valore unit.</th>
            <th className="t-right" style={{width:110}}>Valore</th><th className="t-right" style={{width:90}}>Aliquota</th>
            <th style={{width:120}}>Conto</th><th style={{minWidth:140}}>Luogo</th></tr></thead>
          <tbody>{lista.map(a => { const vu = n(a.cespValore)||costoUn(a); const qt = n(a.cespQta)||1; return <tr key={a.id}>
            <td>{a.descrizione}</td>
            <td><input className="cellinput" list="cesp-cat" value={a.cespCategoria||""} onChange={e=>set(a.id,{cespCategoria:e.target.value})}/></td>
            <td><input type="date" className="cellinput" value={a.cespData||""} onChange={e=>set(a.id,{cespData:e.target.value})}/></td>
            <td><Num className="cellinput n" value={a.cespQta || 1} onChange={v=>set(a.id,{cespQta:v})}/></td>
            <td><Num className="cellinput n" value={a.cespValore || Math.round(costoUn(a)*100)/100} onChange={v=>set(a.id,{cespValore:v})}/></td>
            <td className="t-right num"><strong>{eur(vu*qt)}</strong></td>
            <td><Num className="cellinput n" value={a.cespAliquota} onChange={v=>set(a.id,{cespAliquota:v})}/></td>
            <td><input className="cellinput" value={a.cespConto||""} onChange={e=>set(a.id,{cespConto:e.target.value})} placeholder="es. 1.10.20"/></td>
            <td><Sel value={a.cespUbicazione||""} placeholder="—" options={ubicazioni.map(u=>({v:u.id,l:u.nome}))} onChange={v=>set(a.id,{cespUbicazione:v})}/></td>
          </tr>; })}</tbody>
          <tfoot><tr><td colSpan={5}>Totale</td><td className="t-right num">{eur(totale)}</td><td colSpan={3}></td></tr></tfoot>
        </table></div>}
    </div>
    <datalist id="cesp-cat">{["Attrezzature bar","Impianti","Arredi","Elettronica","Automezzi","Macchinari"].map(c => <option key={c} value={c}/>)}</datalist>
  </>;
}

/* ============================ IMPOSTAZIONI ============================ */
function Setup({ctx}){
  const {mode, toast, articoli, setArticoli, fornitori, setFornitori, ordini, setOrdini,
         prodotti, setProdotti, ubicazioni, setUbicazioni, movimenti, setMovimenti} = ctx;
  const [conferma, setConferma] = useState(null);
  const fileRef = useRef(null);

  const backup = () => {
    const data = {v:1, esportatoIl:new Date().toISOString(), articoli, fornitori, ordini, prodotti, ubicazioni, movimenti};
    download(new Blob([JSON.stringify(data,null,2)],{type:"application/json"}), "master_backup_"+today()+".json");
    toast("Backup scaricato","ok");
  };
  const ripristina = async e => {
    const f = e.target.files[0]; if (!f) return;
    try{
      const d = JSON.parse(await f.text());
      if (d.articoli) setArticoli(d.articoli);
      if (d.fornitori) setFornitori(d.fornitori);
      if (d.ordini) setOrdini(d.ordini);
      if (d.prodotti) setProdotti(d.prodotti);
      if (d.ubicazioni) setUbicazioni(d.ubicazioni);
      if (d.movimenti) setMovimenti(d.movimenti);
      toast("Dati ripristinati","ok");
    }catch(err){ toast("File di backup non valido","err"); }
    e.target.value = "";
  };
  const caricaEsempio = () => {
    const s = buildSeed();
    setArticoli(l => [...l, ...s.articoli]);
    setProdotti(l => [...l, ...s.prodotti]);
    setUbicazioni(l => l.length ? l : s.ubicazioni);
    setFornitori(l => l.length ? l : s.fornitori);
    toast("Dati di esempio caricati","ok");
  };
  const svuota = () => { [ "articoli","fornitori","ordini","prodotti","ubicazioni","movimenti" ].forEach(k => Store.save(k, []));
    setArticoli([]); setFornitori([]); setOrdini([]); setProdotti([]); setUbicazioni([]); setMovimenti([]); toast("Dati azzerati"); };

  return <>
    <Top title="Impostazioni" hint="Fornitori, sincronizzazione e dati"/>
    <div className="wrap grid" style={{gap:16, maxWidth:1000}}>
      <div className="card">
        <header><h3>Fornitori</h3><div className="spacer"/>
          <button className="btn sm gold" onClick={()=>setFornitori(l => [...l, {id:uid(), nome:"Nuovo fornitore", referente:"", email:"", telefono:"", note:""}])}>Aggiungi</button>
        </header>
        {fornitori.length === 0
          ? <Empty>Nessun fornitore in rubrica.</Empty>
          : <table>
            <thead><tr><th>Nome</th><th>Referente</th><th>Email</th><th>Telefono</th><th>Note</th><th style={{width:40}}></th></tr></thead>
            <tbody>{fornitori.map(f => <tr key={f.id}>
              {["nome","referente","email","telefono","note"].map(k =>
                <td key={k}><input className="cellinput" value={f[k]||""} onChange={e=>setFornitori(l => l.map(x => x.id===f.id?{...x,[k]:e.target.value}:x))}/></td>)}
              <td className="t-right"><button className="icobtn del" onClick={()=>setFornitori(l => l.filter(x => x.id !== f.id))}>🗑</button></td>
            </tr>)}</tbody>
          </table>}
      </div>

      <div className="card">
        <header><h3>Sincronizzazione</h3></header>
        <div className="body">
          <p style={{marginTop:0}}>
            <span className="dot" style={{background: mode==="cloud" ? "#2f7a55" : "#b8811b"}}/>
            {mode === "cloud"
              ? <>I dati sono sincronizzati su Firebase (progetto <strong>{FIREBASE_CONFIG.projectId}</strong>) e disponibili su tutti i dispositivi.</>
              : <>L'app sta lavorando <strong>solo su questo dispositivo</strong>: i dati restano nel browser. Per sincronizzarli incolla la configurazione Firebase nel file <code>index.html</code> (blocco <code>FIREBASE_CONFIG</code>).</>}
          </p>
          <p className="small muted" style={{marginBottom:0}}>Fai comunque un backup periodico: svuotare la cache del browser cancella i dati locali.</p>
        </div>
      </div>

      <div className="card">
        <header><h3>Dati</h3></header>
        <div className="body btnrow">
          <button className="btn pri" onClick={backup}>Scarica backup</button>
          <button className="btn" onClick={()=>fileRef.current.click()}>Ripristina da backup</button>
          <button className="btn" onClick={caricaEsempio}>Carica dati di esempio</button>
          <button className="btn danger" onClick={()=>setConferma("svuota")}>Azzera tutto</button>
          <input ref={fileRef} type="file" accept=".json" style={{display:"none"}} onChange={ripristina}/>
        </div>
        <div className="body" style={{paddingTop:0}}>
          <div className="kpis">
            <div className="kpi"><div className="lab">Articoli</div><div className="val">{articoli.length}</div></div>
            <div className="kpi"><div className="lab">Ordini</div><div className="val">{ordini.length}</div></div>
            <div className="kpi"><div className="lab">Prodotti</div><div className="val">{prodotti.length}</div></div>
            <div className="kpi"><div className="lab">Movimenti</div><div className="val">{movimenti.length}</div></div>
          </div>
        </div>
      </div>

      <div className="card">
        <header><h3>Modelli Excel</h3></header>
        <div className="body btnrow">
          <button className="btn" onClick={templateOrdine}>Modello ordine</button>
          <button className="btn" onClick={templateArticoli}>Modello articoli</button>
          <button className="btn" onClick={templateMagazzino}>Modello giacenze</button>
        </div>
      </div>
    </div>

    {conferma === "svuota" && <Confirm yesLabel="Azzera tutto" text="Cancello articoli, ordini, prodotti, luoghi e movimenti. L'operazione non è reversibile: scarica prima un backup."
      onClose={()=>setConferma(null)} onYes={svuota}/>}
  </>;
}

/* ============================ avvio ============================ */
Store.init();
ReactDOM.createRoot(document.getElementById("root")).render(<App/>);
</script>
</body>
</html>
